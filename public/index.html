<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Autopsy</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e4e7ec;--acc:#2f5bea;--ok:#0f8a4b;--bad:#c2372b;--warn:#b26b00;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--mute:#98a2b3;--line:#2a2f38;--acc:#6f8fff;--ok:#35c37a;--bad:#ff6b5e;--warn:#f0a33a;--chip:#232833}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 6px;max-width:1500px;margin:auto}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
main{max-width:1500px;margin:auto;padding:8px 16px 40px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px}
.go{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--chip);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:var(--chip);border-radius:20px;padding:4px 10px;font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mute{color:var(--mute)}
details.m{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0}
details.m summary{list-style:none;padding:12px 14px;cursor:pointer}
details.m summary::-webkit-details-marker{display:none}
.mt{font-weight:600;font-size:14px}
.ml{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin-top:4px}
.mb{padding:0 14px 14px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:12px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.err{color:var(--bad);font-size:14px}
.h-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.h-row button{padding:6px 10px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;cursor:pointer;white-space:nowrap}
.addr{font-family:ui-monospace,Menlo,monospace;font-size:12px}
a{color:var(--acc)}
.hide{display:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.w{min-width:1100px}
table.w td:first-child div:first-child{max-width:190px;overflow:hidden;text-overflow:ellipsis}
table.w th,table.w td{padding:6px 7px}
.scroll::-webkit-scrollbar{height:10px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
table.w th{cursor:pointer;user-select:none;white-space:nowrap}
table.w td{white-space:nowrap}
table.w tr.cl{cursor:pointer}
table.w tr.cl:hover td{background:var(--chip)}
.mini{font-size:11px;color:var(--mute)}
.filt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:end}
@media(min-width:720px){.filt{grid-template-columns:repeat(5,1fr)}}
.filt label{margin:0 0 4px}
select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px}
.cpt{font-size:13px;color:var(--mute);padding-bottom:12px}
.duo{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:1100px){.duo{grid-template-columns:1fr 1fr}}
table.w2{min-width:520px;margin-top:8px}
table.w2 td,table.w2 th{white-space:nowrap;padding:6px 6px}
table.w2 tr.cl{cursor:pointer}
table.w2 tr.cl:hover td{background:var(--chip)}
.nm{max-width:160px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
  <h1>Wallet Autopsy</h1>
  <div class="sub">Profilage de portefeuilles Polymarket — lecture seule, données publiques</div>
</header>
<main>
  <div class="tabs">
    <button id="t3" class="on" onclick="tab(3)">Marché</button>
    <button id="t1" onclick="tab(1)">Portefeuille</button>
    <button id="t2" onclick="tab(2)">Détenteurs</button>
  </div>

  <section id="p3">
    <div class="card">
      <label for="qm">Lien de la page Polymarket du marché</label>
      <input id="qm" placeholder="https://polymarket.com/fr/event/btc-updown-5m-…" autocomplete="off" spellcheck="false">
      <button class="go" id="goM" onclick="marche()">Analyser tous les portefeuilles</button>
    </div>
    <div id="outM"></div>
  </section>

  <section id="p1" class="hide">
    <div class="card">
      <label for="addr">Adresse du portefeuille</label>
      <input id="addr" placeholder="0x…" autocomplete="off" spellcheck="false">
      <label for="filtre">Filtre sur le titre du marché (facultatif)</label>
      <input id="filtre" placeholder="ex. Bitcoin Up or Down" autocomplete="off">
      <input id="market" type="hidden">
      <div id="marketInfo" class="note hide"></div>
      <button class="go" id="goW" onclick="analyser()">Analyser</button>
    </div>
    <div id="outW"></div>
  </section>

  <section id="p2" class="hide">
    <div class="card">
      <label for="q">Lien de la page Polymarket ou slug de l'événement</label>
      <input id="q" placeholder="https://polymarket.com/event/…" autocomplete="off" spellcheck="false">
      <button class="go" id="goH" onclick="detenteurs()">Voir les détenteurs</button>
    </div>
    <div id="outH"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const f2 = (x) => x == null ? "—" : Number(x).toLocaleString("fr-CH", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const f4 = (x) => x == null ? "—" : Number(x).toFixed(4);
const f0 = (x) => x == null ? "—" : Math.round(Number(x)).toLocaleString("fr-CH");
const usd = (x) => x == null ? "—" : (x < 0 ? "−" : "") + "$" + f2(Math.abs(x));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt = (t) => t ? new Date(t * 1000).toLocaleString("fr-CH", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const sec = (s) => s == null ? "—" : s < 60 ? s + " s" : (s / 60).toFixed(1) + " min";

function tab(n){ for (const k of [1,2,3]) { $("t"+k).classList.toggle("on", n===k); $("p"+k).classList.toggle("hide", n!==k); } }

let M = null, triCle = "volume", triSens = -1;
async function marche(){
  const q = $("qm").value.trim();
  history.replaceState(null, "", "?m=" + encodeURIComponent(q));
  $("goM").disabled = true; $("outM").innerHTML = '<div class="card mute">Téléchargement de tous les trades du marché… (jusqu\'à 30 s)</div>';
  try { M = await api("/api/market?q=" + encodeURIComponent(q)); rendM(); }
  catch(e){ $("outM").innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; }
  finally { $("goM").disabled = false; }
}
const COLS = [
  ["adresse","Portefeuille", w => w.nom || w.adresse],
  ["trades","Trades", w => w.trades],
  ["achatA","A parts", w => w.achatA],
  ["pmA","A prix", w => w.pmA],
  ["achatB","B parts", w => w.achatB],
  ["pmB","B prix", w => w.pmB],
  ["combine","Combiné", w => w.combine],
  ["volume","Misé", w => w.cout],
  ["pnl","PnL", w => w.pnl],
  ["roi","ROI", w => w.roi],
  ["avantFinSec","1re entrée", w => w.avantFinSec],
  ["ecartMedianSec","Écart méd.", w => w.ecartMedianSec],
  ["tags","Profil", w => w.tags.join(" ")],
];
function trier(c){ if (triCle === c) triSens = -triSens; else { triCle = c; triSens = -1; } rendTable(); }
let FIL = { t: "", m: "", r: "", p: "" };
function rendM(){
  const d = M, s = d.synthese, A = d.issues[0] || "A", B = d.issues[1] || "B";
  const etat = d.resolu ? "Résolu : <b>" + esc(d.prix[0] === 1 ? A : B) + "</b> gagne" : d.ferme ? "Fermé, en attente de résolution" : "En cours — PnL au dernier prix (" + esc(A) + " " + f2(d.prix[0]) + " / " + esc(B) + " " + f2(d.prix[1]) + ")";
  let h = '<div class="card"><div class="mt">' + esc(d.question || d.titre) + '</div><div class="note" style="margin-top:2px">' + etat
    + (d.autresMarches ? ' · cet événement contient ' + d.autresMarches + ' marchés, seul le premier est analysé' : '') + '</div>'
    + '<div class="kpis" style="margin-top:10px">'
    + kpi(f0(s.portefeuilles), "portefeuilles") + kpi(f0(s.trades), "trades")
    + kpi(usd(s.volumeAchats), "misé au total") + kpi(f0(s.automates), "automates")
    + kpi(f0(s.deuxCotes), "achètent les deux côtés") + kpi(f0(s.pairesSousUn), "dont paires sous 1 $")
    + kpi('<span class="ok">' + f0(s.gagnants) + '</span> / <span class="bad">' + f0(s.perdants) + '</span>', "gagnants / perdants")
    + kpi(s.partTop10Volume == null ? "—" : Math.round(s.partTop10Volume*100) + " %", "du volume fait par les 10 plus gros")
    + '</div><div class="note">A = ' + esc(A) + ', B = ' + esc(B) + '. PnL = encaissé (ventes + fusions) + valeur des parts restantes − misé. '
    + 'Fusions lues pour les ' + d.activiteLuePourTop + ' plus gros portefeuilles. « 1re entrée » = temps restant avant la fin du marché au premier trade. Clique un en-tête pour trier, une ligne pour l\'historique complet du portefeuille.'
    + (d.tronque ? ' <b class="warn">L\'API a limité l\'historique : les trades les plus anciens manquent.</b>' : '') + '</div></div>';

  h += '<div class="card filt"><div><label for="fT">Trades min.</label><input id="fT" type="number" inputmode="numeric" value="' + esc(FIL.t) + '" oninput="filtrer()"></div>'
    + '<div><label for="fM">Misé min. ($)</label><input id="fM" type="number" inputmode="decimal" value="' + esc(FIL.m) + '" oninput="filtrer()"></div>'
    + '<div><label for="fR">ROI min. (%)</label><input id="fR" type="number" inputmode="decimal" value="' + esc(FIL.r) + '" oninput="filtrer()"></div>'
    + '<div><label for="fP">Profil</label><select id="fP" onchange="filtrer()"><option value="">Tous</option>'
    + [...new Set(d.portefeuilles.flatMap(w => w.tags))].sort().map(t => '<option' + (FIL.p===t?' selected':'') + '>' + esc(t) + '</option>').join("") + '</select></div>'
    + '<div class="cpt" id="cpt"></div></div>';
  h += '<div class="duo"><div class="card"><div class="mt">Top 20 — performance sur ce marché</div><div class="note">Classés par PnL en $, avec les filtres ci-dessus.</div><div id="topPerf"></div></div>'
    + '<div class="card"><div class="mt">Top 20 — à copier</div><div class="note" id="copNote">Lecture de l\'historique des 60 plus gros portefeuilles sur les marchés du même type…</div><div id="topCop"></div></div></div>';
  h += '<div id="tab"></div>';
  $("outM").innerHTML = h;
  rendTable();
  chargerCopier();
}
let COP = null;
async function chargerCopier(){
  const d = M; COP = null;
  const cands = [...d.portefeuilles].sort((a, b) => (b.cout + b.encaisse) - (a.cout + a.encaisse)).slice(0, 60).map(w => w.adresse);
  try {
    const r = await api("/api/copier?slug=" + encodeURIComponent(d.slug || "") + "&titre=" + encodeURIComponent(d.question || "") + "&addrs=" + cands.join(","));
    if (M !== d) return;
    COP = r; rendCopier();
  } catch(e){ $("copNote").innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
}
const nomDe = (a) => { const w = M.portefeuilles.find(x => x.adresse === a); return w && w.nom ? w.nom : a.slice(0,8) + "…" + a.slice(-4); };
function ligneMini(a, cells){ return '<tr class="cl" onclick="versPortefeuille(\'' + a + '\')"><td><div class="nm">' + esc(nomDe(a)) + '</div></td>' + cells + '</tr>'; }
function rendPerf(garde){
  const top = garde.filter(w => w.pnl != null).sort((a, b) => b.pnl - a.pnl).slice(0, 20);
  let h = '<div class="scroll"><table class="w2"><tr><th>#</th><th>Portefeuille</th><th>PnL</th><th>ROI</th><th>Misé</th><th>Trades</th><th>Profil</th></tr>';
  top.forEach((w, i) => { const c = w.pnl > 0 ? "ok" : w.pnl < 0 ? "bad" : "";
    h += ligneMini(w.adresse, '<td class="' + c + '">' + usd(w.pnl) + '</td><td class="' + c + '">' + (w.roi==null?"—":(w.roi*100).toFixed(1)+" %") + '</td><td>' + usd(w.cout) + '</td><td>' + w.trades + '</td><td>' + w.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join(" ") + '</td>').replace('<tr class="cl"', '<tr class="cl" data-i="' + (i+1) + '"').replace('<td><div class="nm">', '<td class="mute">' + (i+1) + '</td><td><div class="nm">'); });
  $("topPerf").innerHTML = top.length ? h + '</table></div>' : '<div class="note">Aucun portefeuille avec ces filtres.</div>';
}
function rendCopier(){
  const r = COP, MIN = 10;
  const ok = r.portefeuilles.filter(w => w.marches >= MIN && w.regularite != null).sort((a, b) => b.regularite - a.regularite).slice(0, 20);
  $("copNote").innerHTML = 'Historique sur les marchés <b>' + esc(r.famille) + '</b> (200 dernières positions de chacun). ' + r.evalues + ' portefeuilles évalués, au moins ' + MIN + ' marchés exigés. '
    + 'Classés par <b>régularité</b> : ROI moyen par marché divisé par sa dispersion × √(nombre de marchés) — plus c\'est haut, plus le gain est constant et moins il tient de la chance.';
  let h = '<div class="scroll"><table class="w2"><tr><th>#</th><th>Portefeuille</th><th>Régularité</th><th>Marchés</th><th>% gagnés</th><th>PnL total</th><th>ROI</th></tr>';
  ok.forEach((w, i) => { const c = w.pnl > 0 ? "ok" : w.pnl < 0 ? "bad" : "";
    h += ligneMini(w.adresse, '<td><b>' + w.regularite.toFixed(1) + '</b></td><td>' + w.marches + '</td><td>' + Math.round(w.pctGagnes*100) + ' %</td><td class="' + c + '">' + usd(w.pnl) + '</td><td class="' + c + '">' + (w.roi==null?"—":(w.roi*100).toFixed(1)+" %") + '</td>').replace('<td><div class="nm">', '<td class="mute">' + (i+1) + '</td><td><div class="nm">'); });
  $("topCop").innerHTML = ok.length ? h + '</table></div>' : '<div class="note">Aucun portefeuille n\'a assez d\'historique sur ce type de marché.</div>';
}
function filtrer(){ FIL = { t: $("fT").value, m: $("fM").value, r: $("fR").value, p: $("fP").value }; rendTable(); }
function rendTable(){
  const d = M;
  const col = COLS.find(c => c[0] === triCle) || COLS[7];
  const nt = parseFloat(FIL.t), nm = parseFloat(FIL.m), nr = parseFloat(FIL.r);
  const garde = d.portefeuilles.filter(w => (isNaN(nt) || w.trades >= nt) && (isNaN(nm) || w.cout >= nm)
    && (isNaN(nr) || (w.roi != null && w.roi * 100 >= nr)) && (!FIL.p || w.tags.includes(FIL.p)));
  $("cpt").textContent = garde.length + " / " + d.portefeuilles.length + " portefeuilles";
  rendPerf(garde);
  const rows = garde.sort((x, y) => { const a = col[2](x), b = col[2](y);
    if (a == null) return 1; if (b == null) return -1; return (typeof a === "string" ? a.localeCompare(b) : a - b) * triSens; });
  let h = '<div class="card scroll"><table class="w"><tr>' + COLS.map(c => '<th onclick="trier(\'' + c[0] + '\')">' + c[1] + (c[0]===triCle ? (triSens<0?" ▾":" ▴") : "") + '</th>').join("") + '</tr>';
  for (const w of rows) {
    const pc = w.pnl == null ? "" : w.pnl > 0 ? "ok" : w.pnl < 0 ? "bad" : "";
    h += '<tr class="cl" onclick="versPortefeuille(\'' + w.adresse + '\')"><td><div>' + esc(w.nom || "—") + '</div><div class="addr mini">' + w.adresse.slice(0,8) + '…' + w.adresse.slice(-4) + '</div></td>'
      + '<td>' + w.trades + '</td><td>' + f0(w.achatA) + '</td><td>' + f4(w.pmA) + '</td><td>' + f0(w.achatB) + '</td><td>' + f4(w.pmB) + '</td>'
      + '<td class="' + (w.combine==null?"":w.combine<1?"ok":"bad") + '">' + f4(w.combine) + '</td>'
      + '<td>' + usd(w.cout) + '</td><td class="' + pc + '">' + usd(w.pnl) + '</td><td class="' + pc + '">' + (w.roi==null?"—":(w.roi*100).toFixed(1)+" %") + '</td>'
      + '<td>' + (w.avantFinSec==null?"—":sec(w.avantFinSec)) + '</td><td>' + sec(w.ecartMedianSec) + '</td>'
      + '<td>' + w.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join(" ") + '</td></tr>';
  }
  $("tab").innerHTML = h + '</table></div>';
}
function versPortefeuille(a){
  $("addr").value = a; $("filtre").value = ""; $("market").value = "";
  $("marketInfo").classList.add("hide"); tab(1); analyser(); window.scrollTo(0,0);
}

async function api(path){ const r = await fetch(path); const j = await r.json(); if (!r.ok || j.erreur) throw new Error(j.erreur || ("Erreur " + r.status)); return j; }

async function analyser(){
  const addr = $("addr").value.trim(), filtre = $("filtre").value.trim(), market = $("market").value;
  const q = new URLSearchParams({addr}); if (filtre) q.set("filtre", filtre); if (market) q.set("market", market);
  history.replaceState(null, "", "?" + q.toString());
  $("goW").disabled = true; $("outW").innerHTML = '<div class="card mute">Téléchargement des trades…</div>';
  try { rendW(await api("/api/wallet?" + q)); }
  catch(e){ $("outW").innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; }
  finally { $("goW").disabled = false; }
}

function rendW(d){
  const s = d.synthese;
  const cls = (v) => v == null ? "" : v < 1 ? "ok" : v > 1 ? "bad" : "";
  let h = '<div class="card"><div class="kpis">'
   + kpi(f0(s.marches), "marchés") + kpi(f0(s.trades), "trades")
   + kpi(usd(s.volumeAchats), "volume acheté") + kpi(usd(s.fluxRealise), "flux réalisés*")
   + kpi(f0(s.marchesDeuxCotes) + " / " + f0(s.marches), "marchés achetés des deux côtés")
   + kpi('<span class="'+cls(s.combineMoyenPondere)+'">' + f4(s.combineMoyenPondere) + '</span>', "prix combiné moyen des paires")
   + kpi('<span class="'+(s.margePairesTotale>0?"ok":s.margePairesTotale<0?"bad":"")+'">' + usd(s.margePairesTotale) + '</span>', "marge figée sur les paires")
   + kpi(sec(s.ecartMedianSec), "écart médian entre trades")
   + '</div><div class="tags">' + s.profil.map(t => '<span class="tag">' + esc(t) + '</span>').join("") + '</div>'
   + '<div class="note">* Ventes + fusions + remboursements − achats − splits. Les parts encore détenues ne sont pas valorisées.'
   + (d.tronque ? ' <b class="warn">Historique tronqué par l\'API : seules les lignes les plus récentes sont prises.</b>' : '')
   + (d.activiteIndisponible ? ' <b class="warn">Fusions et remboursements indisponibles.</b>' : '')
   + ' — ' + f0(d.lignes.trades) + ' trades, ' + f0(d.lignes.activite) + ' mouvements.</div></div>';

  if (!d.marches.length) h += '<div class="card mute">Aucun marché trouvé' + (d.filtre ? ' avec ce filtre' : '') + '.</div>';
  for (const m of d.marches) {
    const link = m.eventSlug ? 'https://polymarket.com/event/' + encodeURIComponent(m.eventSlug) : null;
    h += '<details class="m"><summary><div class="mt">' + esc(m.titre || m.conditionId) + '</div><div class="ml">'
      + '<span>' + dt(m.premier) + '</span><span>' + m.nTrades + ' trades</span>'
      + (m.combine != null ? '<span class="' + cls(m.combine) + '">combiné ' + f4(m.combine) + '</span>' : '<span>un seul côté</span>')
      + (m.pairesAchetees ? '<span class="' + (m.margePaires>=0?"ok":"bad") + '">marge ' + usd(m.margePaires) + '</span>' : '')
      + '<span>flux ' + usd(m.fluxRealise) + '</span></div></summary><div class="mb"><table><tr><th>Issue</th><th>Parts achetées</th><th>Prix moyen</th><th>Parts vendues</th><th>Prix vente</th><th>Tendance prix</th><th>Accum.</th></tr>';
    for (const o of m.issues) {
      h += '<tr><td>' + esc(o.nom) + '</td><td>' + f0(o.achatParts) + '</td><td>' + f4(o.prixMoyenAchat) + '</td><td>' + f0(o.venteParts)
        + '</td><td>' + f4(o.prixMoyenVente) + '</td><td class="' + (o.tendancePrix>0.02?"warn":"") + '">' + (o.tendancePrix==null?"—":(o.tendancePrix>0?"+":"")+o.tendancePrix.toFixed(3))
        + '</td><td>' + (o.accumulation==null?"—":o.accumulation.toFixed(2)+"×") + '</td></tr>';
    }
    h += '</table><div class="note">Paires : ' + f0(m.pairesAchetees) + ' · parts non appariées : ' + f0(m.partsNonAppariees)
      + ' · fusions : ' + f0(m.merges) + ' (' + usd(m.mergeUsdc) + ') · remboursé : ' + usd(m.redeemUsdc)
      + ' · durée : ' + (m.dureeMin<1? Math.round(m.dureeMin*60)+" s" : m.dureeMin.toFixed(1)+" min")
      + ' · écart médian : ' + sec(m.ecartMedianSec) + ' · même seconde : ' + (m.memeSecondePct==null?"—":m.memeSecondePct.toFixed(0)+" %")
      + (link ? ' · <a href="' + link + '" target="_blank" rel="noopener">page Polymarket</a>' : '') + '</div></div></details>';
  }
  $("outW").innerHTML = h;
}
const kpi = (v, l) => '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>';

async function detenteurs(){
  const q = $("q").value.trim();
  $("goH").disabled = true; $("outH").innerHTML = '<div class="card mute">Recherche…</div>';
  try {
    const d = await api("/api/holders?q=" + encodeURIComponent(q));
    let h = '<div class="card"><div class="mt">' + esc(d.titre) + '</div>';
    for (const m of d.marches) {
      if (d.marches.length > 1) h += '<div class="note" style="margin-top:14px"><b>' + esc(m.question) + '</b></div>';
      const tous = m.cotes.flatMap(c => c.detenteurs).sort((a,b) => b.parts - a.parts);
      if (!tous.length) h += '<div class="note">Aucun détenteur renvoyé.</div>';
      for (const x of tous) {
        h += '<div class="h-row"><div><div>' + esc(x.nom || "—") + ' · <b>' + esc(x.issue) + '</b> ' + f0(x.parts) + '</div><div class="addr mute">' + esc(x.adresse) + '</div></div>'
          + '<button onclick="depuisDet(\'' + esc(x.adresse) + '\',\'' + esc(m.conditionId) + '\',\'' + esc(m.question).replace(/'/g,"") + '\')">Analyser</button></div>';
      }
    }
    $("outH").innerHTML = h + '</div>';
  } catch(e){ $("outH").innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; }
  finally { $("goH").disabled = false; }
}
function depuisDet(addr, cid, q){
  $("addr").value = addr; $("filtre").value = ""; $("market").value = cid;
  $("marketInfo").textContent = "Limité au marché : " + q + " (effacer l'adresse pour tout voir)";
  $("marketInfo").classList.remove("hide"); tab(1); analyser();
}
$("addr").addEventListener("input", () => { $("market").value = ""; $("marketInfo").classList.add("hide"); });

// Relance depuis l'adresse de la page
const p = new URLSearchParams(location.search);
if (p.get("m")) { $("qm").value = p.get("m"); marche(); }
else if (p.get("addr")) { tab(1); }
if (p.get("addr")) { $("addr").value = p.get("addr"); $("filtre").value = p.get("filtre") || ""; $("market").value = p.get("market") || ""; analyser(); }
</script>
