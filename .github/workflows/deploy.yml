name: Deploy Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer
        run: |
          set +e
          npx -y wrangler@4 deploy > /tmp/deploy.log 2>&1; echo "code sortie: $?" >> /tmp/deploy.log
          tail -25 /tmp/deploy.log
      - name: Controle apres deploiement
        run: |
          set +e
          mkdir -p diagnostic
          U=https://wallet-autopsy.pitch67.workers.dev
          sleep 15
          A=0x6031b6eed1c97e853c6e0f03ad3ce3529351f96d
          {
            echo "=== deploiement"; tail -12 /tmp/deploy.log
            echo; echo "=== /api/sante"; curl -sS -m 20 $U/api/sante
            echo; echo "=== page"; curl -sS -m 20 -o /dev/null -w "%{http_code}" $U/
            echo; echo "=== /api/wallet"; curl -sS -m 60 "$U/api/wallet?addr=$A" | head -c 2500
            echo; echo "=== brut trades"; curl -sS -m 20 "https://data-api.polymarket.com/trades?user=$A&limit=2&takerOnly=false" | head -c 1500
            echo; echo "=== brut activity"; curl -sS -m 20 "https://data-api.polymarket.com/activity?user=$A&limit=2&type=MERGE,REDEEM,SPLIT" | head -c 1500
          } > diagnostic/controle.txt 2>&1
          git config user.name "controle"
          git config user.email "bot@users.noreply.github.com"
          git add diagnostic/controle.txt
          git commit -m "Controle apres deploiement [skip ci]" && git push
