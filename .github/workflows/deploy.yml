name: Deploy Cloudflare
on:
  push:
    branches: [main]
    paths-ignore: [bot95/**, etude/**, .github/workflows/bot95.yml, .github/workflows/bot5min.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Base D1
        run: |
          set +e
          npm i -g wrangler@4 >/dev/null 2>&1
          ID=$(wrangler d1 list --json 2>/dev/null | python3 -c "import json,sys;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='wallet-autopsy'),''))")
          if [ -z "$ID" ]; then wrangler d1 create wallet-autopsy --location weur > /tmp/d1.log 2>&1; cat /tmp/d1.log | tail -5
            ID=$(wrangler d1 list --json 2>/dev/null | python3 -c "import json,sys;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='wallet-autopsy'),''))"); fi
          echo "D1: $ID" | tee /tmp/deploy.log
          sed -i "s/A_REMPLACER_PAR_LE_WORKFLOW/$ID/" wrangler.jsonc
      - name: Deployer
        run: |
          set +e
          wrangler deploy >> /tmp/deploy.log 2>&1; echo "code sortie: $?" >> /tmp/deploy.log
          # Migrations APRÈS le déploiement : l'ancien code ne doit jamais écrire dans un schéma réinitialisé
          wrangler d1 migrations apply wallet-autopsy --remote >> /tmp/deploy.log 2>&1; echo "migrations: $?" >> /tmp/deploy.log
          tail -30 /tmp/deploy.log
      - name: Controle apres deploiement
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          mkdir -p diagnostic
          U=https://wallet-autopsy.pitch67.workers.dev
          sleep 15
          A=0x6031b6eed1c97e853c6e0f03ad3ce3529351f96d
          {
            echo "=== deploiement"; grep -E "D1:|migrations|Deployed|code sortie|rror|schedule|cron" /tmp/deploy.log | head -20
            echo; echo "=== /api/btc/etat"; curl -sS -m 30 $U/api/btc/etat
            sleep 120; echo; echo "=== /api/btc/etat 2 min plus tard"; curl -sS -m 30 $U/api/btc/etat
            echo; echo "=== /api/sante"; curl -sS -m 20 $U/api/sante
            echo; echo "=== page"; curl -sS -m 20 -o /dev/null -w "%{http_code}" $U/
            echo; echo "=== /api/market"; curl -sS -m 90 "$U/api/market?q=https%3A%2F%2Fpolymarket.com%2Ffr%2Fevent%2Fbtc-updown-5m-1790840700" > /tmp/m.json; head -c 3000 /tmp/m.json
            echo; echo "=== /api/wallet"; curl -sS -m 60 "$U/api/wallet?addr=$A" | head -c 800
            echo; echo "=== brut closed-positions"; curl -sS -m 20 "https://data-api.polymarket.com/closed-positions?user=0x21f4c1&limit=2" | head -c 300
            echo; B=$(python3 -c "import json;d=json.load(open('/tmp/m.json'));print(','.join(w['adresse'] for w in d['portefeuilles'][:12]))")
            curl -sS -m 20 "https://data-api.polymarket.com/closed-positions?user=$(echo $B | cut -d, -f1)&limit=3&sortBy=TIMESTAMP&sortDirection=DESC" | head -c 2500
            echo; echo "=== /api/copier"; curl -sS -m 90 "$U/api/copier?slug=btc-updown-5m-1790840700&addrs=$B" | head -c 3000
            echo; echo "=== brut trades"; curl -sS -m 20 "https://data-api.polymarket.com/trades?user=$A&limit=2&takerOnly=false" | head -c 1500
            echo; echo "=== brut activity"; curl -sS -m 20 "https://data-api.polymarket.com/activity?user=$A&limit=2&type=MERGE,REDEEM,SPLIT" | head -c 1500
          } > diagnostic/controle.txt 2>&1
          git config user.name "controle"
          git config user.email "bot@users.noreply.github.com"
          git add diagnostic/controle.txt
          git commit -m "Controle apres deploiement [skip ci]" && for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
