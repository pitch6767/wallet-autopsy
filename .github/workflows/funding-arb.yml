name: Deploy Funding Arb
on:
  push:
    branches: [main]
    paths: [funding-arb/src/**, funding-arb/public/**, funding-arb/migrations/**, funding-arb/wrangler.jsonc, funding-arb/controle.sh, .github/workflows/funding-arb.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: funding-arb
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Clés des plateformes (secrets GitHub) → secrets Cloudflare du Worker ; jamais dans le code
      GATE_KEY: ${{ secrets.GATE_KEY }}
      GATE_SECRET: ${{ secrets.GATE_SECRET }}
      BYBIT_KEY: ${{ secrets.BYBIT_KEY }}
      BYBIT_SECRET: ${{ secrets.BYBIT_SECRET }}
      OKX_KEY: ${{ secrets.OKX_KEY }}
      OKX_SECRET: ${{ secrets.OKX_SECRET }}
      OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
      KUCOIN_KEY: ${{ secrets.KUCOIN_KEY }}
      KUCOIN_SECRET: ${{ secrets.KUCOIN_SECRET }}
      KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer et controler
        run: |
          set +e
          npm i -g wrangler@4 >/dev/null 2>&1
          cd funding-arb
          U=https://funding-arb.pitch67.workers.dev
          # garde-fou : ne jamais écraser un autre Worker qui porterait déjà le nom « funding-arb »
          code=$(curl -sS -m 20 -o /tmp/avant.html -w "%{http_code}" $U/)
          if [ "$code" = "200" ] && ! grep -q "funding-arb-app" /tmp/avant.html; then
            echo "STOP : un autre Worker nommé funding-arb existe déjà, rien n'a été déployé" > controle.txt
          else
            lire_id() { wrangler d1 list --json 2>/dev/null | python3 -c "import json,sys;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='funding-arb'),''))"; }
            ID=$(lire_id)
            if [ -z "$ID" ]; then wrangler d1 create funding-arb --location weur > /tmp/d1.log 2>&1; ID=$(lire_id); fi
            echo "D1: $ID" > /tmp/d.log
            sed -i "s/A_REMPLACER_PAR_LE_WORKFLOW/$ID/" wrangler.jsonc
            wrangler deploy >> /tmp/d.log 2>&1; echo "code sortie: $?" >> /tmp/d.log
            # migrations APRÈS le déploiement
            wrangler d1 migrations apply funding-arb --remote >> /tmp/d.log 2>&1; echo "migrations: $?" >> /tmp/d.log
            for n in GATE_KEY GATE_SECRET BYBIT_KEY BYBIT_SECRET OKX_KEY OKX_SECRET OKX_PASSPHRASE KUCOIN_KEY KUCOIN_SECRET KUCOIN_PASSPHRASE; do
              v="${!n}"; if [ -n "$v" ]; then printf '%s' "$v" | wrangler secret put "$n" >/dev/null 2>&1 && echo "secret $n posé" >> /tmp/d.log; fi
            done
            sleep 15
            {
              tail -15 /tmp/d.log
              echo "=== page"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" $U/
              echo "=== sonde"; curl -sS -m 60 "$U/api/sonde"; echo
              echo "=== controles"; bash controle.sh "$U"
            } > controle.txt 2>&1
            git checkout wrangler.jsonc
          fi
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add funding-arb/controle.txt; git commit -m "Controle funding-arb [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
