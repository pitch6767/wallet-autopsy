# Transcription du son des vidéos envoyées par Pitch (08.11.2026).
# Claude pousse l'audio (.opus) sur la branche « audio », lance ce workflow, et relit le texte dans la même branche.
name: Transcrire audio
on:
  workflow_dispatch:
    inputs:
      fichier: { description: "chemin du .opus sur la branche audio", required: true }
      modele: { description: "tiny, base, small, medium", required: false, default: "small" }
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: audio }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-${{ github.event.inputs.modele }} }
      - run: |
          pip install -q faster-whisper
          python3 - "${{ github.event.inputs.fichier }}" "${{ github.event.inputs.modele }}" <<'P'
          import sys
          from faster_whisper import WhisperModel
          f, m = sys.argv[1], sys.argv[2]
          seg, info = WhisperModel(m, compute_type="int8").transcribe(f, vad_filter=True)
          L = [f"[{int(s.start)//60:02d}:{int(s.start)%60:02d}] {s.text.strip()}" for s in seg]
          open(f.rsplit(".", 1)[0] + ".txt", "w").write(f"langue: {info.language} ({info.language_probability:.2f})\n" + "\n".join(L) + "\n")
          P
          git config user.name transcription; git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "Transcription [skip ci]" && for k in 1 2 3; do git pull --rebase -q origin audio && git push -q origin HEAD:audio && break; sleep 4; done
