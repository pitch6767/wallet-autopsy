# 07.11.2026 — sonde : lit la fiche publique (entrées / sorties) des modules Apify de téléchargement YouTube
name: MP4 - sonde
on:
  workflow_dispatch:
    inputs:
      id: { description: "inutilise", required: false, default: "x" }
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p mp4_sonde; O=mp4_sonde/apify.txt; : > $O
          for A in streamers~youtube-video-downloader memo23~youtube-video-downloader; do
            echo "===== $A" >> $O
            curl -s -m 30 "https://api.apify.com/v2/acts/$A" > /tmp/a.json
            python3 - >> $O <<'P'
          import json
          d=json.load(open("/tmp/a.json")).get("data",{})
          print("titre:",d.get("title"),"| modifie:",d.get("modifiedAt"))
          print("prix:",json.dumps(d.get("pricingInfos") or d.get("pricingInfo"))[:600])
          print("stats:",json.dumps(d.get("stats"))[:300])
          tb=(d.get("taggedBuilds") or {}).get("latest") or {}
          print("build:",tb)
          open("/tmp/b.txt","w").write(tb.get("buildId",""))
          P
            B=$(cat /tmp/b.txt); curl -s -m 30 "https://api.apify.com/v2/actor-builds/$B" > /tmp/b.json
            python3 - >> $O <<'P'
          import json
          d=json.load(open("/tmp/b.json")).get("data",{})
          print("SCHEMA ENTREE:", (d.get("inputSchema") or "")[:3000])
          print("README:", (d.get("readme") or "")[:5000])
          ad=d.get("actorDefinition") or {}
          print("SORTIE:", json.dumps(ad.get("storages") or ad.get("output") or {})[:1500])
          P
          done
          echo "@@@DEBUT"; cat $O; echo "@@@FIN"
