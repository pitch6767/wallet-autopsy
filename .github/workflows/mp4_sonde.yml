# 07.11.2026 — sonde unique : quelles routes permettent encore de récupérer un MP4 YouTube depuis un serveur ?
name: MP4 - sonde
on:
  workflow_dispatch:
    inputs:
      id: { description: "ID video", required: true, default: "jNQXAC9IVRw" }
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - env: { ID: "${{ github.event.inputs.id }}" }
        run: |
          set +e
          mkdir -p mp4_sonde; O=mp4_sonde/resultat.txt; : > $O
          U="https://www.youtube.com/watch?v=$ID"
          for V in $ID aircAruvnKk; do
            echo "== piped $V" >> $O
            curl -s -m 30 https://api.piped.private.coffee/streams/$V -o /tmp/s.json
            python3 - "$V" >> $O <<'P'
          import json,sys
          try: d=json.load(open("/tmp/s.json"))
          except Exception as e: print("json:",e, open("/tmp/s.json").read()[:200]); sys.exit()
          print("titre:",d.get("title"),"| duree:",d.get("duration"),"| uploader:",d.get("uploader"),"| erreur:",d.get("error"))
          vs=d.get("videoStreams") or []
          print("flux video:",len(vs),"| audio:",len(d.get("audioStreams") or []),"| hls:",bool(d.get("hls")))
          for v in vs: print("  ",v.get("quality"),v.get("format"),"videoOnly=",v.get("videoOnly"),v.get("url","")[:90])
          m=[v for v in vs if not v.get("videoOnly")]
          open("/tmp/u.txt","w").write((m[0]["url"] if m else (vs[0]["url"] if vs else "")))
          P
            U2=$(cat /tmp/u.txt); [ -n "$U2" ] && { curl -s -m 120 -L -o /tmp/f.mp4 -w "telechargement: HTTP %{http_code} %{size_download} octets en %{time_total}s\n" "$U2" >> $O; file /tmp/f.mp4 >> $O; }
          done
          git config user.name mp4; git config user.email bot@users.noreply.github.com
          git add mp4_sonde && git commit -qm "MP4 sonde [skip ci]" && for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
