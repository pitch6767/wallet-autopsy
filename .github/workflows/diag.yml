name: Diagnostic
on:
  push:
    branches: [main]
    paths: [diagnostic/demande.txt, diagnostic/probe.sh]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger
        run: |
          set +e
          D=https://data-api.polymarket.com
          U=https://wallet-autopsy.pitch67.workers.dev
          SLUG=btc-updown-5m-1790840700
          {
          bash diagnostic/probe.sh
          } > diagnostic/resultat.txt 2>&1
          git config user.name diag; git config user.email bot@users.noreply.github.com
          git add diagnostic/resultat.txt; git commit -m "Diagnostic [skip ci]"; git push
