name: Test correctif cache mode
on:
  push:
    branches: [correctif-cache-mode]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          cd bot95 && npm install --no-audit --no-fund > /tmp/npm.log 2>&1
          (npx -y wrangler@4 dev --config test_cache/wrangler.jsonc --port 8799 --ip 127.0.0.1 > /tmp/dev.log 2>&1 &)
          for k in $(seq 1 60); do sleep 2; curl -s -o /dev/null http://127.0.0.1:8799/ && break; done
          curl -sS -m 90 http://127.0.0.1:8799/ > test_cache/resultat.json; cat test_cache/resultat.json; tail -20 /tmp/dev.log
          cd ..; git config user.name test; git config user.email bot@users.noreply.github.com
          git add bot95/test_cache/resultat.json; git commit -q -m "Resultat test cache mode [skip ci]"; git push -q origin HEAD:correctif-cache-mode
