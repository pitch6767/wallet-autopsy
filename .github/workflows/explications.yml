name: Deploy Explications
on:
  push:
    branches: [main]
    paths: [explications/**, .github/workflows/explications.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          cd explications
          U=https://explications.pitch67.workers.dev
          code=$(curl -sS -m 20 -o /tmp/avant.html -w "%{http_code}" $U/)
          if [ "$code" = "200" ] && ! grep -q "explications-app" /tmp/avant.html; then
            echo "STOP : un autre Worker nommé explications existe déjà" > controle.txt
          else
            npx -y wrangler@4 deploy > /tmp/d.log 2>&1; echo "code sortie: $?" >> /tmp/d.log; sleep 15
            { tail -6 /tmp/d.log; for p in / /bot95.html /bot95-sombre.html /bot95-clair.html; do echo "$p $(curl -sS -m 20 -o /dev/null -w '%{http_code}' $U$p)"; done; } > controle.txt 2>&1
          fi
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add explications/controle.txt; git commit -m "Controle explications [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
