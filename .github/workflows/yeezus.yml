name: Yeezus wallets
on:
  push:
    branches: [main]
    paths: [etude/yeezus/etape*.py]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          F=$(ls etude/yeezus/etape*.py | sort -V | tail -1)
          python3 -u $F > etude/yeezus/journal.txt 2>&1 || true
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/yeezus; git commit -m "Yeezus résultats [skip ci]"; for k in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done
