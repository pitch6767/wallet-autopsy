name: Video - lecture pour Claude
on:
  push:
    branches: [main]
    paths: [video/demande.txt]
permissions:
  contents: write
jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demander et attendre
        run: |
          set +e
          U=https://video.pitch67.workers.dev
          mkdir -p video/resultats
          while read -r action a b; do
            [ -z "$action" ] && continue
            case "$action" in
              analyser) id=$(curl -sS -m 60 -G "$U/api/analyser" --data-urlencode "url=$a" ${b:+--data-urlencode "fps=$b"} | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))") ;;
              question) id="$a"; curl -sS -m 60 -G "$U/api/question" --data-urlencode "id=$a" --data-urlencode "q=$b" > /dev/null ;;
              lire) id="$a" ;;
              refaire) id=$(curl -sS -m 60 -G "$U/api/analyser" --data-urlencode "url=$a" --data-urlencode "refaire=1" ${b:+--data-urlencode "fps=$b"} | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))") ;;
            esac
            [ -z "$id" ] && continue
            for k in $(seq 1 45); do
              t=$(curl -sS -m 30 "$U/r/$id.txt")
              echo "$t" | head -3 | grep -q "STATUT : \(fait\|erreur\|incomplet\)" && ! echo "$t" | grep -q "\[attente\]" && break
              sleep 20
            done
            curl -sS -m 30 "$U/r/$id.txt" > "video/resultats/$id.txt"
          done < video/demande.txt
          curl -sS -m 30 "$U/api/etat" > video/resultats/_etat.json
          npm i -q playwright@1 >/dev/null 2>&1 && npx -y playwright@1 install --with-deps chromium >/dev/null 2>&1
          cat > ./_cap.mjs <<'JS'
          import { chromium } from "playwright";
          const U = "https://video.pitch67.workers.dev";
          const ids = process.argv.slice(2);
          const b = await chromium.launch();
          for (const [nom, vp] of [["iphone", { width: 390, height: 844 }], ["ordi", { width: 1280, height: 900 }]]) {
            const p = await b.newPage({ viewport: vp, deviceScaleFactor: 2 });
            await p.goto(U + "/", { waitUntil: "networkidle" }); await p.screenshot({ path: `video/resultats/_accueil-${nom}.png`, fullPage: true });
            for (const id of ids) { await p.goto(`${U}/r/${id}`, { waitUntil: "networkidle" }); await p.screenshot({ path: `video/resultats/_page-${id}-${nom}.png` }); }
          }
          await b.close();
          JS
          node ./_cap.mjs $(ls -t video/resultats/*.txt | xargs -n1 basename | sed 's/\.txt$//' | head -3)
          git config user.name video; git config user.email bot@users.noreply.github.com
          git add video/resultats; git commit -m "Video lue [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
