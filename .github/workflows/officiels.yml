name: Valeurs officielles
on:
  push:
    branches: [main]
    paths: [etude/bot5min/officiels.py, bot95/officiels_go.txt]
permissions:
  contents: write
jobs:
  o:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python3 -u etude/bot5min/officiels.py
          git config user.name o; git config user.email bot@users.noreply.github.com
          git add bot95/officiels.json; git commit -q -m "officiels [skip ci]"; for k in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
