name: Arbitrage 15 min contre 5 min
on:
  push:
    branches: [main]
    paths: [etude/bot5min/arb15.py]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        actif: [btc, eth, sol, xrp, doge, bnb, hype]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          set +e
          python3 -u etude/bot5min/arb15.py 7 ${{ matrix.actif }} > etude/bot5min/journal_arb15_${{ matrix.actif }}.txt 2>&1
          echo "code sortie: $?" >> etude/bot5min/journal_arb15_${{ matrix.actif }}.txt
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/bot5min/
          git commit -m "Resultats arb15 ${{ matrix.actif }} [skip ci]"; for k in $(seq 1 25); do git pull --rebase -q origin main && git push && break; sleep $((RANDOM % 20 + 5)); done
