name: Deploy Sans-perte
on:
  push:
    branches: [main]
    paths: [sans-perte/src/**, sans-perte/public/**, sans-perte/wrangler.jsonc, sans-perte/demande.txt, .github/workflows/sans_perte.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sans-perte
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer et controler
        run: |
          set +e
          cd sans-perte
          U=https://sans-perte.pitch67.workers.dev
          code=$(curl -sS -m 20 -o /tmp/avant.html -w "%{http_code}" $U/)
          if [ "$code" = "200" ] && ! grep -q "sans-perte-app" /tmp/avant.html; then
            echo "STOP : un autre Worker nommé sans-perte existe déjà, rien n'a été déployé" > controle.txt
          else
            for k in 1 2 3 4; do npx -y wrangler@4 deploy > /tmp/d.log 2>&1 && break; sleep 40; done; echo "essais deploiement: $k" >> /tmp/d.log; sleep 10
            {
              tail -12 /tmp/d.log 2>/dev/null
              echo "=== page"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" $U/
              echo "=== test"; curl -sS -m 600 $U/api/test; echo
            } > controle.txt 2>&1
          fi
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add sans-perte/controle.txt; git commit -m "Controle sans-perte [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
