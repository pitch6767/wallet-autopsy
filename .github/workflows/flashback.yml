name: Deploy Flashback
on:
  push:
    branches: [main]
    paths: [flashback/**, .github/workflows/flashback.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer et controler
        run: |
          set +e
          cd flashback
          U=https://flashback.pitch67.workers.dev
          # garde-fou : ne jamais écraser un autre Worker qui porterait déjà le nom « flashback »
          code=$(curl -sS -m 20 -o /tmp/avant.html -w "%{http_code}" $U/)
          if [ "$code" = "200" ] && ! grep -q "flashback-app" /tmp/avant.html; then
            echo "STOP : un autre Worker nommé flashback existe déjà, rien n'a été déployé" > controle.txt
          else
            npx -y wrangler@4 deploy > /tmp/d.log 2>&1; echo "code sortie: $?" >> /tmp/d.log
            sleep 15
            {
              tail -15 /tmp/d.log
              echo "=== page"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" $U/
              echo "=== joueur"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" $U/j/ABCD
              echo "=== salle"; curl -sS -m 20 -X POST $U/api/salle; echo
              echo "=== videos"; for v in fc15NK89NjI MlUGUSTHg3c 5L9riIlydjQ 4i6NgsMkYqM OnqMSHh3TG8 p4wcqHkOcc8 tYoNil1lpgk YTY7BntVmi0; do echo "$v $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v=$v")"; done
              echo "=== deezer 0"; curl -sS -m 30 "$U/api/test-deezer?i=0"; echo
              echo "=== deezer 40"; curl -sS -m 30 "$U/api/test-deezer?i=40"; echo
              echo "=== deezer 80"; curl -sS -m 30 "$U/api/test-deezer?i=80"; echo
            } > controle.txt 2>&1
          fi
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add flashback/controle.txt; git commit -m "Controle flashback [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
