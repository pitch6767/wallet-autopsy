name: Analyse hqb
on:
  push:
    branches: [main]
    paths: [etude/hqb/hqb.py]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyse
        run: |
          set +e
          python3 -u etude/hqb/hqb.py > etude/hqb/journal.txt 2>&1
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/hqb/
          git commit -m "Resultats hqb [skip ci]"; for k in $(seq 1 25); do git pull --rebase -q origin main && git push && break; sleep 7; done
