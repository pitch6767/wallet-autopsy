name: Diagnostic PolyBolt
on:
  push:
    branches: [main]
    paths: [bot95/pbdiag_go.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 5
          curl -sS -m 60 "https://bot95.pitch67.workers.dev/api/rapidecycles?apres=1791712000" | head -c 3000 > bot95/pbdiag.json; echo >> bot95/pbdiag.json
          curl -sS -m 60 -o /dev/null -w "cycle %{http_code} %{size_download}\n" "https://bot95.pitch67.workers.dev/api/rapidecycle?start=1791720300" >> bot95/pbdiag.json
          cat bot95/pbdiag.json
          git config user.name diag; git config user.email bot@users.noreply.github.com
          git add bot95/pbdiag.json; git commit -q -m "Diagnostic PolyBolt [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
