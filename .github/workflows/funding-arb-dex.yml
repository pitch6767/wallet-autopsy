name: Funding Arb - liste DEX
on:
  push:
    branches: [main]
    paths: [funding-arb/dex/lister.mjs, .github/workflows/funding-arb-dex.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lister:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node funding-arb/dex/lister.mjs
      - run: |
          git config user.name controle; git config user.email bot@users.noreply.github.com
          git add funding-arb/dex/resultat.txt; git commit -m "Liste DEX [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
