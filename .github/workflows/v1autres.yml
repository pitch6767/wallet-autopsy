name: V1 autres cryptos
on:
  push:
    branches: [main]
    paths: [etude/bot5min/v1_autres.py]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        actif: [["eth","ETHUSDT"],["sol","SOLUSDT"],["xrp","XRPUSDT"],["doge","DOGEUSDT"],["bnb","BNBUSDT"],["hype","HYPEUSDT"],["btc","BTCUSDT"]]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          set +e
          python3 -u etude/bot5min/v1_autres.py 7 ${{ matrix.actif[0] }} ${{ matrix.actif[1] }} > etude/bot5min/journal_v1_${{ matrix.actif[0] }}.txt 2>&1
          echo "code sortie: $?" >> etude/bot5min/journal_v1_${{ matrix.actif[0] }}.txt
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/bot5min/
          git commit -m "Resultats V1 ${{ matrix.actif[0] }} [skip ci]"; for k in 1 2 3 4 5 6 7 8; do git pull --rebase -q origin main && git push && break; sleep $((RANDOM % 20 + 5)); done
