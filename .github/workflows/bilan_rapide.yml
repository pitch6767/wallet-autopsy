name: Bilan rapide
on:
  push:
    branches: [main]
    paths: [bot95/bilan_go.txt]
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          curl -sS -m 90 https://bot95.pitch67.workers.dev/api/nouveaux > /tmp/n.json; echo "taille $(wc -c < /tmp/n.json)" > bot95/bilan_err.txt; head -c 300 /tmp/n.json >> bot95/bilan_err.txt
          python3 - <<'P' > bot95/bilan.txt 2>>bot95/bilan_err.txt
          import json
          d=json.load(open('/tmp/n.json'))
          R=d.get('resume',{}); A=set(d.get('actives',[]))
          rows=[(k,v) for k,v in R.items()]
          for k,v in sorted(rows,key=lambda x:-x[1]['pnl']):
              print(f"{k} | n={v['n']} g={v['gains']} p={v['pertes']} pnl={v['pnl']:+.0f} depuis={v['depuis']} creux={v.get('creux')} serieMax={v.get('serieMax')} serie={v.get('serie')} series={v.get('series')}")
          B=d.get('blink',{}); print('BLINK', json.dumps(B)[:1500])
          Z={k:v for k,v in d.get('strats',{}).items() if 'zone' in k or 'desaccord 30' in k}
          json.dump(Z,open('bot95/zone_trades.json','w'),ensure_ascii=False)
          P
          git config user.name b; git config user.email bot@users.noreply.github.com
          git add bot95/; git commit -m "bilan [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
