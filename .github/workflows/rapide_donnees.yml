# Export des enregistrements complets du bot rapide (VPS Dublin) vers la branche donnees-rapide (pas sur main, pour ne pas l'alourdir)
name: Donnees bot rapide
on:
  push:
    branches: [main]
    paths: [bot95/rapide_go.txt]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
concurrency: { group: rapide-donnees, cancel-in-progress: false }
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger les nouveaux cycles (une branche par jour, 18.10.2026)
        run: |
          exec > >(tee /tmp/export.log) 2>&1
          set -x
          # 18.10.2026 : la branche unique donnees-rapide dépassait la taille d'un envoi GitHub (erreur 500 depuis le 16.10 21:21).
          # Désormais une branche par jour : dr-AAAA-MM-JJ (un seul commit chacune). Les jours déjà sur donnees-rapide y restent.
          git config user.name rapide; git config user.email bot@users.noreply.github.com
          python3 - <<'P'
          import json, time, urllib.request
          U = "https://bot95.pitch67.workers.dev"
          L = json.load(urllib.request.urlopen(urllib.request.Request(U + "/api/rapidecycles?apres=0", headers={"User-Agent": "rapide"}), timeout=90))["cycles"]
          jours = sorted({time.strftime("%Y-%m-%d", time.gmtime(c["start"])) for c in L})
          open("/tmp/jours", "w").write("\n".join(j for j in jours if j >= "2026-10-16"))
          json.dump(L, open("/tmp/liste.json", "w"))
          P
          for J in $(cat /tmp/jours); do
            B=dr-$J; W=/tmp/w-$J; mkdir -p $W && cd $W && git init -q && git config user.name rapide && git config user.email bot@users.noreply.github.com
            set +x; git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" 2>/dev/null || true; set -x
            if git fetch -q --depth 1 origin $B 2>/dev/null; then git checkout -q FETCH_HEAD; fi
            git checkout -q -B $B
            python3 - "$J" <<'P'
          import json, os, glob, sys, time, urllib.request
          J = sys.argv[1]; U = "https://bot95.pitch67.workers.dev"
          deja = {int(os.path.basename(p).split(".")[0]) for p in glob.glob("cycles/*/*.json.gz")}
          n = 0
          for c in json.load(open("/tmp/liste.json")):
              st = c["start"]
              if time.strftime("%Y-%m-%d", time.gmtime(st)) != J or st in deja: continue
              os.makedirs("cycles/" + J, exist_ok=True)
              for k in range(4):
                  try:
                      d = urllib.request.urlopen(urllib.request.Request(f"{U}/api/rapidecycle?start={st}", headers={"User-Agent": "rapide"}), timeout=90).read(); break
                  except Exception as e: time.sleep(4); d = None
              if d: open(f"cycles/{J}/{st}.json.gz", "wb").write(d); n += 1
          print(J, "nouveaux cycles", n)
          P
            git add cycles 2>/dev/null; git commit -q --amend -m "cycles bot rapide $J" 2>/dev/null || git commit -q -m "cycles bot rapide $J" || echo "rien de neuf $J"
            for k in 1 2 3; do git push -q -f origin $B && break; sleep 5; done
            cd /
          done
      - name: Journal de l'export (sur main)
        if: always()
        run: |
          cd /tmp && rm -rf m && git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" m && cd m
          cp /tmp/export.log bot95/export_rapide.log 2>/dev/null || echo "pas de journal" > bot95/export_rapide.log
          git config user.name rapide; git config user.email bot@users.noreply.github.com
          git add bot95/export_rapide.log; git commit -qm "Journal export rapide [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
