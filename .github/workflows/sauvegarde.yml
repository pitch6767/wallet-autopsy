name: Sauvegarde des trades
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths: [bot95/sauvegarde_go.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          if [ -f bot95/zone_trades.json ] && [ ! -f bot95/sauvegarde/.importe ]; then python3 etude/bot5min/sauvegarde.py bot95/zone_trades.json > /tmp/s.log 2>&1 && touch bot95/sauvegarde/.importe; else python3 etude/bot5min/sauvegarde.py > /tmp/s.log 2>&1; fi
          tail -60 /tmp/s.log
          mkdir -p bot95/journaux && tail -80 /tmp/s.log > bot95/journaux/sauvegarde.txt
          # 13.10.2026 : rapide_maker.json dépasse 100 Mo (refusé par GitHub, plus aucune sauvegarde depuis 15:35 UTC) → gardé compressé
          [ -f bot95/rapide_maker.json ] && gzip -9 -c bot95/rapide_maker.json > bot95/rapide_maker.json.gz && git rm -q --cached --ignore-unmatch bot95/rapide_maker.json
          git config user.name sauvegarde; git config user.email bot@users.noreply.github.com
          for f in bot95/journaux/sauvegarde.txt bot95/sauvegarde bot95/reglements.json bot95/twap_confirme.json bot95/twap_carnets.json bot95/v2f_variantes.json bot95/vitesse.json bot95/rapide.json bot95/rapide_maker.json.gz bot95/chainlink_migration.json bot95/vitesse_cloudflare.json; do [ -e "$f" ] && git add "$f"; done; git commit -q -m "Sauvegarde des trades [skip ci]"; for k in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q && break; sleep 7; done
