# Controle qualite independant du convertisseur MP4 (constat seulement, ne modifie rien)
name: MP4 - QA
on:
  workflow_dispatch:
    inputs:
      mode: { description: "statique ou ui", required: true, default: "statique" }
      url: { description: "lien YouTube (mode ui)", required: false, default: "" }
      qualite: { description: "qualite (mode ui)", required: false, default: "360p" }
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Preparer Playwright
        run: |
          mkdir -p /tmp/qa && cd /tmp/qa && npm init -y >/dev/null && npm i -s playwright@1.55.0 2>&1 | tail -3
          npx playwright install --with-deps webkit chromium 2>&1 | tail -5
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1; echo pret
      - name: Controles API et securite
        if: ${{ github.event.inputs.mode == 'statique' }}
        run: |
          set +e
          U=https://mp4.pitch67.workers.dev
          echo "@@@DEBUT"
          echo "== HTML /"; curl -s $U/ -o /tmp/p.html -w "HTTP %{http_code} %{size_download}o\n"; grep -ciE "apify_api_[A-Za-z0-9]{10,}" /tmp/p.html; grep -oE 'token=[^"&]+' /tmp/p.html | head
          echo "== etat"; curl -s $U/api/etat | tee /tmp/etat.json; echo; grep -ciE "apify_api_|token" /tmp/etat.json
          for b in '{"cle":"apify_api_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}' '{"cle":"apify_api_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","ancienne":"apify_api_BBBBBBBBBBBBBBBBBBBBBBBB"}' '{}'; do
            echo "== POST /api/cle $b"; curl -s -X POST $U/api/cle -H 'content-type: application/json' -d "$b" -w "  [HTTP %{http_code}]\n"; done
          echo "== POST /api/cle corps non JSON"; curl -s -X POST $U/api/cle -d 'xx' -w "  [HTTP %{http_code}]\n"
          for l in "https://example.com/video" "pas un lien" "" "youtube.com/watch?v=dQw4w9WgXcQ" "https://youtu.be/" "https://www.youtube.com/playlist?list=PLx"; do
            echo "== lancer [$l]"; curl -s -X POST $U/api/lancer -H 'content-type: application/json' -d "{\"url\":\"$l\",\"qualite\":\"360p\"}" -w "  [HTTP %{http_code}]\n"; done
          echo "== suivi run bidon"; curl -s "$U/api/suivi?run=xxxxxxxxxxxxxxxxx" -w "  [HTTP %{http_code}]\n"
          echo "== suivi sans run"; curl -s "$U/api/suivi" -w "  [HTTP %{http_code}]\n"
          echo "== fichier run bidon"; curl -s "$U/api/fichier?run=bidon" -w "  [HTTP %{http_code}]\n"
          echo "== api inconnue"; curl -s "$U/api/xyz" -w "  [HTTP %{http_code}]\n"
          echo "== CORS / acces externe a lancer (sans aucune authentification)"; curl -s -o /dev/null -D - -X OPTIONS $U/api/lancer -H 'Origin: https://evil.example' | head -5
          echo "== Range sur fichier existant (Me at the zoo)"; curl -s -r 0-99 -o /dev/null -D - "$U/api/fichier?run=ZcXeBBbSNZbN8YSYL&voir=1" | grep -iE "^HTTP|content-(range|length|type|disposition)|accept-ranges"
          echo "== en-tetes fichier existant (19 min, 3Blue1Brown)"; curl -s -o /tmp/long.mp4 -D /tmp/hl.txt -w "HTTP %{http_code} %{size_download}o %{time_total}s\n" "$U/api/fichier?run=t4ZauMoaEoeMcNu0O"; grep -iE "content-(type|disposition|length)" /tmp/hl.txt
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,codec_tag_string,profile,width,height -of compact /tmp/long.mp4
          echo "== YouTube : durees des candidats (page watch)"
          for id in aqz-KE-bpKQ ygeCgN-SfE8 dQw4w9WgXcQ; do
            P=$(curl -sL -A "Mozilla/5.0" -H "Accept-Language: fr" "https://www.youtube.com/watch?v=$id"); echo "$id len=$(echo "$P" | grep -oE '"lengthSeconds":"[0-9]+"' | head -1) titre=$(echo "$P" | grep -oE '<title>[^<]*' | head -1)"; done
          echo "== Shorts de @ColinAmazing"; curl -sL -A "Mozilla/5.0" "https://www.youtube.com/@ColinAmazing/shorts" | grep -oE '/shorts/[A-Za-z0-9_-]{11}' | sort -u | head -5
          for id in ygeCgN-SfE8; do echo "shorts/$id -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -A 'Mozilla/5.0' https://www.youtube.com/shorts/$id)"; done
          echo "@@@FIN"
      - name: Captures Playwright
        if: ${{ github.event.inputs.mode == 'statique' }}
        run: |
          cd /tmp/qa && cat > s.js <<'EOF'
          const { webkit, chromium, devices } = require('playwright');
          const U = 'https://mp4.pitch67.workers.dev/';
          (async () => {
            console.log('@@@DEBUT');
            const wb = await webkit.launch();
            for (const sch of ['light', 'dark']) {
              const c = await wb.newContext({ ...devices['iPhone 13'], locale: 'fr-CH', colorScheme: sch });
              const p = await c.newPage(); const errs = []; p.on('pageerror', e => errs.push(e.message)); p.on('console', m => m.type() === 'error' && errs.push(m.text()));
              await p.goto(U); await p.waitForSelector('#boxConv:not([hidden])', { timeout: 15000 }).catch(() => console.log('boxConv non visible'));
              await p.waitForTimeout(1500);
              const m = await p.evaluate(() => ({ sw: document.documentElement.scrollWidth, iw: innerWidth, lang: document.documentElement.lang, cleVisible: !document.getElementById('boxCle').hidden, convVisible: !document.getElementById('boxConv').hidden, focus: document.activeElement.id, texte: document.body.innerText.slice(0, 900), larges: [...document.querySelectorAll('*')].filter(e => e.getBoundingClientRect().right > innerWidth + 1).map(e => e.tagName + '#' + e.id + '.' + e.className).slice(0, 10) }));
              console.log(sch, JSON.stringify(m)); console.log('erreurs JS', JSON.stringify(errs));
              await p.screenshot({ path: `iphone_${sch}.png`, fullPage: true });
              if (sch === 'light') {
                for (const [n, l] of [['exemple', 'https://example.com/video'], ['texte', 'pas un lien'], ['vide', '']]) {
                  await p.fill('#url', l); await p.click('#btnGo'); await p.waitForFunction(() => !/Envoi/.test(document.getElementById('msg').textContent), null, { timeout: 15000 }).catch(() => {});
                  console.log('invalide', n, JSON.stringify(await p.textContent('#msg')), 'classe', await p.getAttribute('#msg', 'class'));
                  await p.screenshot({ path: `iphone_invalide_${n}.png` });
                }
                await p.click('#lienChanger'); await p.fill('#cle', 'apify_api_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'); await p.click('#btnCle');
                await p.waitForFunction(() => !/Vérification/.test(document.getElementById('msgCle').textContent), null, { timeout: 15000 }).catch(() => {});
                console.log('changer cle sans ancienne', JSON.stringify(await p.textContent('#msgCle')));
                await p.screenshot({ path: 'iphone_changer_cle.png', fullPage: true });
                const h = await p.content(); console.log('cle dans DOM', /apify_api_(?!A{20})[A-Za-z0-9]{10,}/.test(h));
              }
              await c.close();
            }
            await wb.close();
            const cb = await chromium.launch(); const c = await cb.newContext({ viewport: { width: 1366, height: 900 }, locale: 'fr-CH' });
            const p = await c.newPage(); await p.goto(U); await p.waitForTimeout(2500); await p.screenshot({ path: 'ordinateur.png', fullPage: true });
            console.log('ordinateur', JSON.stringify(await p.evaluate(() => ({ sw: document.documentElement.scrollWidth, iw: innerWidth }))));
            await cb.close();
            console.log('@@@FIN');
          })();
          EOF
          node s.js
      - name: Conversion par l'interface iPhone
        if: ${{ github.event.inputs.mode == 'ui' }}
        env: { URL: "${{ github.event.inputs.url }}", Q: "${{ github.event.inputs.qualite }}" }
        run: |
          cd /tmp/qa && cat > u.js <<'EOF'
          const { webkit, devices } = require('playwright');
          (async () => {
            console.log('@@@DEBUT');
            const b = await webkit.launch(); const c = await b.newContext({ ...devices['iPhone 13'], locale: 'fr-CH', acceptDownloads: true });
            const p = await c.newPage(); const t0 = Date.now();
            await p.goto('https://mp4.pitch67.workers.dev/'); await p.waitForSelector('#boxConv:not([hidden])');
            await p.fill('#url', process.env.URL); await p.selectOption('#qualite', process.env.Q); await p.click('#btnGo');
            for (let i = 0; i < 150; i++) { await p.waitForTimeout(4000); const m = await p.textContent('#msg'); if (i % 5 === 0) console.log(Math.round((Date.now() - t0) / 1000) + 's', m); if (!/en cours|Envoi/.test(m)) break; }
            console.log('message final', JSON.stringify(await p.textContent('#msg')), await p.getAttribute('#msg', 'class'));
            await p.screenshot({ path: 'ui_fin.png', fullPage: true });
            const a = await p.$('#res a.bouton:not(.second)');
            if (a) {
              const [d] = await Promise.all([p.waitForEvent('download', { timeout: 600000 }), a.click()]);
              console.log('nom propose', JSON.stringify(d.suggestedFilename())); await d.saveAs('/tmp/ui.mp4');
              console.log('liens', JSON.stringify(await p.$$eval('#res a', x => x.map(e => [e.textContent, e.getAttribute('href'), e.target]))));
            }
            await b.close(); console.log('@@@FIN');
          })();
          EOF
          node u.js
          echo "@@@DEBUT ffprobe"; ls -l /tmp/ui.mp4 && file /tmp/ui.mp4 && ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,codec_tag_string,width,height -of compact /tmp/ui.mp4; echo "@@@FIN"
      - name: Verification sans conversion (fichier deja pret)
        if: ${{ github.event.inputs.mode == 'verif' }}
        env: { RUN: "${{ github.event.inputs.url }}" }
        run: |
          set +e
          U=https://mp4.pitch67.workers.dev
          echo "@@@DEBUT"; curl -s $U/api/etat; echo
          curl -s -o /tmp/f.mp4 -D /tmp/h.txt -w "fichier HTTP %{http_code} %{size_download}o\n" "$U/api/fichier?run=$RUN"; grep -iE "content-(type|disposition|length)|accept-ranges" /tmp/h.txt
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,codec_tag_string,width,height -of compact /tmp/f.mp4
          echo "== Range voir=1"; curl -s -r 1000-1999 -o /dev/null -D - "$U/api/fichier?run=$RUN&voir=1" | grep -iE "^HTTP|content-range|content-length|accept-ranges"
          cd /tmp/qa && cat > v.js <<'EOS'
          const { webkit, devices } = require('playwright');
          (async () => {
            const b = await webkit.launch(); const c = await b.newContext({ ...devices['iPhone 13'], locale: 'fr-CH', acceptDownloads: true });
            const p = await c.newPage(); await p.goto('https://mp4.pitch67.workers.dev/'); await p.waitForSelector('#boxListe:not([hidden])');
            const a = p.locator('#liste a').first(); console.log('lien liste', await a.getAttribute('href'));
            const dl = p.waitForEvent('download', { timeout: 60000 }).then(d => 'download ' + d.suggestedFilename()).catch(e => 'pas de download: ' + e.message.split('\n')[0]);
            await a.click().catch(e => console.log('clic', e.message)); console.log(await dl); console.log('url apres clic', p.url());
            await p.waitForTimeout(3000); await p.screenshot({ path: 'apres_clic.png' }); await b.close();
          })();
          EOS
          node v.js; echo "@@@FIN"
      - name: Publier les captures sur la branche qa-mp4
        if: always()
        run: |
          mkdir -p /tmp/br && cd /tmp/br && git init -q && git checkout -q -b qa-mp4
          cp /tmp/qa/*.png . 2>/dev/null; ls
          git config user.name qa; git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "captures QA mp4 ${{ github.run_id }} [skip ci]"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} qa-mp4:qa-mp4-${{ github.run_id }}
