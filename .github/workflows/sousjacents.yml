name: H1081 sous-jacents qui menent le BTC (lecture seule)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [bot95/sousjacents_go.txt]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: |
          set +e
          pip install -q pandas numpy tabulate
          python3 etude/bot5min/sousjacents_h1081.py > /tmp/s.log 2>&1
          tail -60 /tmp/s.log
          mkdir -p bot95/journaux && tail -120 /tmp/s.log > bot95/journaux/sousjacents.txt
          git config user.name sousjacents; git config user.email bot@users.noreply.github.com
          git add bot95/journaux/sousjacents.txt etude/bot5min/resultat_sousjacents_h1081* ; git commit -qm "H1081 : resultat sous-jacents [skip ci]"
          for k in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 7; done
