name: Test Kronos
on:
  push:
    branches: [main]
    paths: [etude/bot5min/kronos_test.py, .github/workflows/kronos.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          set +e
          git clone -q --depth 1 https://github.com/shiyu-coder/Kronos /tmp/Kronos
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu > /tmp/pip.log 2>&1
          grep -v -i "^torch" /tmp/Kronos/requirements.txt > /tmp/req.txt; pip install -q -r /tmp/req.txt >> /tmp/pip.log 2>&1
          pip install -q pandas scikit-learn >> /tmp/pip.log 2>&1
          git config user.name tests; git config user.email bot@users.noreply.github.com
          { echo "cpu: $(nproc)"; tail -5 /tmp/pip.log; } > etude/bot5min/journal_kronos_essai.txt
          python3 -u etude/bot5min/kronos_test.py 12 essai >> etude/bot5min/journal_kronos_essai.txt 2>&1
          echo "code sortie: $?" >> etude/bot5min/journal_kronos_essai.txt
          git add etude/bot5min/; git commit -m "Essai Kronos [skip ci]"; for k in $(seq 1 25); do git pull --rebase -q origin main && git push && break; sleep 7; done
          python3 -u etude/bot5min/kronos_test.py 12 > etude/bot5min/journal_kronos.txt 2>&1
          echo "code sortie: $?" >> etude/bot5min/journal_kronos.txt
          git add etude/bot5min/; git commit -m "Resultats Kronos [skip ci]"; for k in $(seq 1 25); do git pull --rebase -q origin main && git push && break; sleep 7; done
