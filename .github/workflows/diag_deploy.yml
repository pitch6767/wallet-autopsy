name: Diag deploiements bot95 (lecture seule)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set +e
          cd bot95
          { echo "=== deployments"; npx -y wrangler@4 deployments list --name bot95 2>&1 | tail -60; echo "=== versions"; npx -y wrangler@4 versions list --name bot95 2>&1 | tail -40; } > /tmp/d.txt
          cd ..; cp /tmp/d.txt bot95/diag_deploy.txt
          git config user.name diag; git config user.email bot@users.noreply.github.com
          git add bot95/diag_deploy.txt && git commit -qm "diag deploiements [skip ci]" && for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
