name: Scan de sécurité du bot (complet, découpé, résultats chiffrés)
# 02.11.2026 (Pitch : « je veux un scan complet, tu peux le découper ») : 4 parties en parallèle, uniquement le site du bot.
# Exclus : déni de service et force brute de mots de passe. Rien n'est affiché dans le journal public :
# chaque partie est chiffrée avec la clé publique de Claude (comme les ops) dans ops/scan_<partie>.enc.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        partie: [ports, tls, nuclei, zap]
    steps:
      - uses: actions/checkout@v4
      - name: Scan ${{ matrix.partie }}
        run: |
          set +e
          H=72-11-157-70.sslip.io; U=https://$H; D=$(mktemp -d); chmod 777 $D; P=${{ matrix.partie }}
          date -u +%FT%TZ > $D/debut.txt
          case $P in
            ports)
              sudo apt-get -qq update >/dev/null 2>&1; sudo apt-get -qq install -y nmap >/dev/null 2>&1
              sudo nmap -Pn -p- -T4 --min-rate 300 -oN $D/tous_ports.txt $H >/dev/null 2>&1
              O=$(grep -E '^[0-9]+/tcp +open' $D/tous_ports.txt | cut -d/ -f1 | paste -sd, -)
              [ -n "$O" ] && sudo nmap -Pn -sV -sC -O -p $O -oN $D/services.txt $H >/dev/null 2>&1
              sudo nmap -Pn -sU --top-ports 50 -oN $D/udp.txt $H >/dev/null 2>&1 ;;
            tls)
              git clone -q --depth 1 https://github.com/drwetter/testssl.sh.git t >/dev/null 2>&1
              ./t/testssl.sh --quiet --color 0 --warnings off $U > $D/testssl.txt 2>&1
              for p in / /api/healthz /api/bot/state /login /api/cases-strategies; do echo "== $p" >> $D/entetes.txt; curl -sSI -m 30 "$U$p" >> $D/entetes.txt 2>&1; done ;;
            nuclei)
              wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.3.7/nuclei_3.3.7_linux_amd64.zip -O n.zip && unzip -q -o n.zip nuclei
              ./nuclei -update-templates -silent >/dev/null 2>&1
              timeout 150m ./nuclei -u $U -rl 20 -c 10 -timeout 8 -etags dos,bruteforce,brute-force -silent -nc -stats -si 300 -o $D/nuclei.txt > $D/nuclei_progression.txt 2>&1 ;;
            zap)
              # exploration + analyse active (injections, XSS, etc.) — peut déclencher le verrou de connexion du bot
              timeout 150m docker run --rm -v $D:/zap/wrk:rw -t ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t $U -m 10 -T 140 -r zap.html -w zap.md -I > $D/zap_progression.txt 2>&1 ;;
          esac
          date -u +%FT%TZ > $D/fin.txt; ls -l $D > $D/_fichiers.txt
          tar czf scan.tgz -C $D .
          K=$(mktemp); openssl rand -hex 32 > $K
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:$K -in scan.tgz -out ops/scan_$P.enc
          openssl pkeyutl -encrypt -pubin -inkey ops/claude_pub.pem -pkeyopt rsa_padding_mode:oaep -in $K -out ops/scan_${P}_cle.enc
          rm -rf $D $K scan.tgz n.zip nuclei t
          git config user.name ops; git config user.email ops@users.noreply.github.com
          git add ops/scan_$P.enc ops/scan_${P}_cle.enc; git commit -q -m "scan sécurité $P $(date -u +%FT%TZ) [skip ci]" || true
          for k in 1 2 3 4 5 6; do git pull --rebase -q origin main && git push -q && break; sleep $((RANDOM % 15 + 5)); done
