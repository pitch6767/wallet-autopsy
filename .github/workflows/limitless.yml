name: Limitless lent
on:
  push:
    branches: [main]
    paths: [etude/bot5min/limitless_mode.txt]
  schedule:
    - cron: "35 13 7 10 *"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Limitless
        run: |
          set +e
          MODE=$(cat etude/bot5min/limitless_mode.txt)
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE="mesure 150"; fi
          python3 -u etude/bot5min/limitless_lent.py $MODE > etude/bot5min/journal_limitless.txt 2>&1
          echo "code sortie: $?" >> etude/bot5min/journal_limitless.txt
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/bot5min/
          git commit -m "Resultats limitless [skip ci]"; for k in $(seq 1 25); do git pull --rebase -q origin main && git push && break; sleep 7; done
