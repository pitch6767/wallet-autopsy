name: Sans-perte sonde
on:
  push:
    branches: [main]
    paths: [sans-perte/sonde*.mjs, .github/workflows/sans_perte_sonde.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd sans-perte
          for f in sonde*.mjs; do echo "=== $f"; timeout 400 node $f; done > sonde.txt 2>&1
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add sans-perte/sonde.txt; git commit -m "Sonde sans-perte [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
