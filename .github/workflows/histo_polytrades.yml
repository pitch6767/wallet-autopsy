name: Historique transactions Polymarket BTC 5 min (lecture seule, API publique)
on:
  workflow_dispatch:
    inputs:
      debut: { description: "debut AAAA-MM-JJTHH:MM (UTC)", default: "2026-10-09T00:00" }
      fin: { description: "fin AAAA-MM-JJTHH:MM (UTC, au plus 13.10 00:00)", default: "2026-10-13T00:00" }
      actif: { description: "btc, eth, sol ou xrp (13.10.2026 : autres actifs, lecture seule)", default: "btc" }
permissions:
  contents: write
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: |
          set +e
          mkdir -p /tmp/h && cd /tmp/h
          python3 - > /tmp/h_sortie.txt 2>&1 <<'P'
          import json, time, gzip, datetime, urllib.request, collections
          G = "https://gamma-api.polymarket.com"; D = "https://data-api.polymarket.com"
          def get(u):
              for k in range(5):
                  try: return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "bot95-etude"}), timeout=60).read())
                  except Exception as e:
                      if "404" in str(e) or "400" in str(e): return None
                      time.sleep(5 if "429" in str(e) else 1.5 * (k + 1))
              return None
          d0 = int(datetime.datetime.fromisoformat("${{ inputs.debut }}").replace(tzinfo=datetime.timezone.utc).timestamp())
          d1 = int(datetime.datetime.fromisoformat("${{ inputs.fin }}").replace(tzinfo=datetime.timezone.utc).timestamp())
          assert d1 <= 1791849600, "periode reservee interdite"
          par_jour = collections.defaultdict(dict); n = 0; manq = 0; jours_ecrits = []
          for st in range(d0 - d0 % 300, d1, 300):
              ev = get(f"{G}/events?slug=${{ inputs.actif }}-updown-5m-{st}")
              if not ev: manq += 1; continue
              m = ev[0]["markets"][0]; cid = m.get("conditionId")
              try: out = json.loads(m["outcomes"]); px = [float(x) for x in json.loads(m["outcomePrices"])]
              except Exception: out, px = [], []
              T = []; off = 0
              while off <= 9500:
                  r = get(f"{D}/trades?market={cid}&limit=500&offset={off}&takerOnly=false")
                  if not r: break
                  T += [[x.get("timestamp"), x.get("proxyWallet"), x.get("side"), x.get("outcome"), x.get("price"), x.get("size"), x.get("transactionHash")] for x in r]
                  if len(r) < 500: break
                  off += 500; time.sleep(0.15)
              jour = time.strftime("%Y-%m-%d", time.gmtime(st))
              for j_ in [j for j in list(par_jour) if j < jour]:   # 14.10.2026 : on écrit chaque jour terminé tout de suite (mémoire)
                  pre_ = "polytrades_" if "${{ inputs.actif }}" == "btc" else "polytrades_${{ inputs.actif }}_"
                  with gzip.open(f"{pre_}{j_}.json.gz", "wt") as f_: json.dump({"format": "[timestamp_s, portefeuille, BUY/SELL, outcome, prix, parts, transaction]", "marches": {str(k): v for k, v in par_jour[j_].items()}}, f_)
                  jours_ecrits.append(j_); del par_jour[j_]
              par_jour[jour][st] = {"resultat": dict(zip(out, px)), "trades": T}; n += len(T)
              time.sleep(0.1)
          A = "${{ inputs.actif }}"; pre = "polytrades_" if A == "btc" else f"polytrades_{A}_"
          for j, M in par_jour.items():
              with gzip.open(f"{pre}{j}.json.gz", "wt") as f: json.dump({"format": "[timestamp_s, portefeuille, BUY/SELL, outcome, prix, parts, transaction]", "marches": {str(k): v for k, v in M.items()}}, f)
          print("transactions", n, "marches manquants", manq)
          open(f"journal_{A}.txt", "w").write(f"actif {A} debut {d0} fin {d1} transactions {n} marches manquants {manq} jours {sorted(set(par_jour) | set(jours_ecrits))}\n")
          P
          ls -la | head; tail -30 /tmp/h_sortie.txt
          cd $GITHUB_WORKSPACE
          # journal du téléchargement sur main (les journaux GitHub ne sont pas lisibles depuis la session)
          git config user.name histo; git config user.email bot@users.noreply.github.com
          mkdir -p bot95/journaux && { ls -la /tmp/h; tail -60 /tmp/h_sortie.txt; } > bot95/journaux/histo_${{ inputs.actif }}_$(echo "${{ inputs.debut }}" | tr -d ":").txt
          git add bot95/journaux && git commit -qm "Journal telechargement ${{ inputs.actif }} [skip ci]" && for k in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          git config user.name histo; git config user.email bot@users.noreply.github.com
          git fetch -q origin donnees-btc:refs/remotes/origin/donnees-btc && git checkout -q -B donnees-btc origin/donnees-btc
          mkdir -p polytrades && cp /tmp/h/*.json.gz polytrades/ ; git add polytrades && git commit -qm "Transactions Polymarket ${{ inputs.actif }} 5 min ${{ inputs.debut }} -> ${{ inputs.fin }}" && for k in 1 2 3 4 5 6 7 8; do git push -q origin donnees-btc && break; sleep $((RANDOM % 30 + 5)); git pull -q --rebase -X theirs origin donnees-btc || git rebase --abort; done
