name: Supprimer l'app video (une fois)
on:
  push:
    branches: [main]
    paths: [.github/workflows/supprimer_video.yml]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          { npx -y wrangler@4 delete --name video --force 2>&1 | tail -5
            sleep 10; echo "=== page apres"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" https://video.pitch67.workers.dev/; } > supprimer_video.txt
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add supprimer_video.txt; git commit -qm "Resultat suppression app video [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
