name: Deploy Bonshommes
on:
  push:
    branches: [main]
    paths: [bonshommes/**, .github/workflows/bonshommes.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer et controler
        run: |
          set +e
          cd bonshommes
          U=https://bonshommes.pitch67.workers.dev
          code=$(curl -sS -m 20 -o /tmp/avant.html -w "%{http_code}" $U/)
          if [ "$code" = "200" ] && ! grep -q "bonshommes-app" /tmp/avant.html; then
            echo "STOP : un autre Worker nommé bonshommes existe déjà, rien n'a été déployé" > controle.txt
          else
            npm install --silent > /tmp/i.log 2>&1
            npx -y wrangler@4 deploy > /tmp/d.log 2>&1; echo "code sortie: $?" >> /tmp/d.log
            sleep 20
            { tail -25 /tmp/d.log
              echo "=== page"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" $U/
              echo "=== etat"; curl -sS -m 30 -A "Mozilla/5.0" "$U/api/etat"; echo
            } > controle.txt 2>&1
          fi
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add bonshommes/controle.txt; git commit -m "Controle bonshommes [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
