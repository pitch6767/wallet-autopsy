name: Deploy Casque
on:
  push:
    branches: [main]
    paths: [casque/**, .github/workflows/casque.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          cd casque
          U=https://casque.pitch67.workers.dev
          code=$(curl -sS -m 20 -o /tmp/avant.html -w "%{http_code}" $U/)
          if [ "$code" = "200" ] && ! grep -q "Casque propre" /tmp/avant.html; then
            echo "STOP : un autre Worker nommé casque existe déjà" > controle.txt
          else
            npx -y wrangler@4 deploy > /tmp/d.log 2>&1; echo "code sortie: $?" >> /tmp/d.log; sleep 15
            {
              tail -6 /tmp/d.log
              for p in / /admin /affiche /qr.js; do echo "$p $(curl -sS -m 20 -o /dev/null -w '%{http_code}' $U$p)"; done
              echo "liste sans code: $(curl -sS -m 20 $U/api/admin/liste)"
              echo "email faux: $(curl -sS -m 20 -X POST -H 'content-type: application/json' -d '{"email":"pasbon"}' $U/api/inscrire)"
            } > controle.txt 2>&1
          fi
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add casque/controle.txt; git commit -m "Controle casque [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
