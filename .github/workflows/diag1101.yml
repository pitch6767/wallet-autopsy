name: Diag 1101 bot95
on:
  push:
    branches: [main]
    paths: [bot95/diag_go.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set +e
          cd bot95
          (timeout 75 npx -y wrangler@4 tail bot95 --format json > /tmp/tail.json 2>/tmp/tail.err &)
          sleep 20
          U=https://bot95.pitch67.workers.dev
          for p in / /api/etat /nouveaux /api/nouveaux /api/reveil; do for k in 1 2; do curl -sS -m 25 -o /tmp/b -w "$p %{http_code} %{time_total}s\n" "$U$p" >> /tmp/c.log; head -c 300 /tmp/b | tr '\n' ' ' >> /tmp/c.log; echo >> /tmp/c.log; sleep 3; done; done
          sleep 30
          { cat /tmp/c.log; echo "=== tail err"; tail -20 /tmp/tail.err; echo "=== tail"; python3 - <<'P'
          import json
          raw=open('/tmp/tail.json').read()
          dec=json.JSONDecoder(); i=0; n=0
          while i < len(raw):
              while i < len(raw) and raw[i] in ' \n\r\t': i+=1
              if i>=len(raw): break
              try: o,j=dec.raw_decode(raw,i)
              except Exception: break
              i=j; n+=1
              ev=o.get('event') or {}; req=(ev.get('request') or {}).get('url') or ev.get('cron') or ''
              print('---', o.get('outcome'), o.get('scriptName'), o.get('entrypoint'), req)
              for e in o.get('exceptions',[]): print('EXC', e.get('name'), e.get('message'), (e.get('stack') or '')[:800])
              for l in o.get('logs',[])[-8:]: print('LOG', l.get('level'), str(l.get('message'))[:400])
          print('events', n)
          P
          } > diag.txt 2>&1
          cd ..; git config user.name diag; git config user.email bot@users.noreply.github.com
          git add bot95/diag.txt; git commit -m "diag 1101 [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
