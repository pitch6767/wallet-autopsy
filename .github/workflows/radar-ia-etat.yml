# Contrôle léger de Radar IA (quelques secondes) : état + édition du moment, sans redéployer
name: Radar IA - etat
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  etat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Lire l'etat
        run: |
          U=https://radar-ia.pitch67.workers.dev
          curl -sS -m 60 "$U/api/etat" > radar-ia/etat.json || true
          curl -sS -m 60 "$U/api/edition" > radar-ia/edition.json || true
          git config user.name controle; git config user.email bot@users.noreply.github.com
          git add radar-ia/etat.json radar-ia/edition.json; git commit -m "Etat radar-ia [skip ci]" || exit 0
          for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
