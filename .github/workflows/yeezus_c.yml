name: Yeezus analyse
on:
  push:
    branches: [main]
    paths: [etude/yeezus/etape15.py]
permissions:
  contents: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trades_gmgn
          run-id: 44641582380
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/a
      - run: |
          gunzip -f /tmp/a/trades_gmgn.json.gz
          timeout 45m python3 -u etude/yeezus/etape15.py 2>&1 | tee etude/yeezus/resultat15.txt
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/yeezus/resultat15.txt etude/yeezus/resultat15.json; git commit -m "Yeezus résultat 10 [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 3; done
