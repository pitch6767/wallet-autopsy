name: Options Deribit - interet ouvert par prix d'exercice (lecture seule)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  o:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          U="https://bot95.pitch67.workers.dev/api/m97?n=40"; apres=None; out=[]; pages=0
          while pages<400:
              url=U+("&apres="+urllib.parse.quote(apres) if apres else "")
              for k in range(4):
                  try: d=json.loads(urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"oi"}),timeout=90).read()); break
                  except Exception as e: time.sleep(5); d=None
              if not d or not d.get("cles"): break
              for doc in d["docs"]:
                  if doc.get("actif")=="BTC" and doc.get("options_oi"): out.append([doc["t"],doc["start"],doc["strike"],doc.get("chainlink"),doc["options_oi"]])
              apres=d["suivant"]; pages+=1
          json.dump(out,open("bot95/options_oi.json","w")); print(len(out),"photos",pages,"pages")
          PY
          git config user.name oi; git config user.email bot@users.noreply.github.com
          git add bot95/options_oi.json && git commit -qm "options oi [skip ci]" && for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
