name: Deploy Peptides
on:
  push:
    branches: [main]
    paths: [peptides/**, '!peptides/qa/**', .github/workflows/peptides.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer et controler
        run: |
          set +e
          cd peptides
          U=https://peptides.pitch67.workers.dev
          # garde-fou : ne jamais écraser un autre Worker qui porterait déjà le nom « peptides »
          code=$(curl -sS -m 20 -o /tmp/avant.html -w "%{http_code}" $U/)
          if [ "$code" = "200" ] && ! grep -q "peptides-app" /tmp/avant.html; then
            echo "STOP : un autre Worker nommé peptides existe déjà, rien n'a été déployé" > controle.txt
          else
            npx -y wrangler@4 deploy > /tmp/d.log 2>&1; echo "code sortie: $?" >> /tmp/d.log
            sleep 15
            {
              tail -15 /tmp/d.log
              echo "=== page"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" $U/
              echo "=== marqueur"; curl -sS -m 20 $U/ | grep -c "peptides-app"
              echo "=== app.js"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" "$U/app.js?v=1.0"
              echo "=== version"; curl -sS -m 20 $U/version.txt
              echo "=== cache"; curl -sS -m 20 -I $U/ | grep -i cache-control
            } > controle.txt 2>&1
          fi
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add peptides/controle.txt; git commit -m "Controle peptides [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
