name: Captures barrieres
on:
  push:
    branches: [main]
    paths: [barrieres/captures.mjs]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node barrieres/captures.mjs > barrieres/captures.txt 2>&1
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add barrieres/capture_*.png barrieres/captures.txt; git commit -m "Captures barrieres [skip ci]"; for k in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done
