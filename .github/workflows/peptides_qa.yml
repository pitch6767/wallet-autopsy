name: QA Peptides
on:
  push:
    branches: [main]
    paths: [peptides/qa/demande.txt, peptides/qa/qa.py, .github/workflows/peptides_qa.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - name: Controle de la vraie adresse
        run: |
          set +e
          mkdir -p peptides/qa/captures
          python3 -I peptides/qa/qa.py https://peptides.pitch67.workers.dev/ peptides/qa/captures > peptides/qa/resultat.txt 2>&1
          echo "code sortie: $?" >> peptides/qa/resultat.txt
          git config user.name controle; git config user.email bot@users.noreply.github.com
          git add peptides/qa/resultat.txt peptides/qa/captures
          git commit -m "QA peptides [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
