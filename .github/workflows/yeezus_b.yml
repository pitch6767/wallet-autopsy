name: Yeezus trades gmgn
on:
  push:
    branches: [main]
    paths: [etude/yeezus/etape9.py]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          timeout 80m python3 -u etude/yeezus/etape9.py 2>&1 | tee etude/yeezus/journal_b.txt || true
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/yeezus/trades_gmgn.json etude/yeezus/journal_b.txt; git commit -m "Yeezus trades gmgn [skip ci]"; for k in 1 2 3 4 5; do git pull --rebase -X theirs -q origin main && git push && break; sleep 5; done
