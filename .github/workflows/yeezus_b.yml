name: Yeezus trades gmgn
on:
  push:
    branches: [main]
    paths: [etude/yeezus/etape9.py]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          timeout 80m python3 -u etude/yeezus/etape9.py 2>&1 | tee /tmp/journal_b.txt || true
          gzip -9 /tmp/trades_gmgn.json; ls -la /tmp/trades_gmgn.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: trades_gmgn
          path: |
            /tmp/trades_gmgn.json.gz
            /tmp/journal_b.txt
          retention-days: 30
