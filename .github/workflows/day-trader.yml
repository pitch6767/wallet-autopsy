name: Deploy Day Trader
on:
  push:
    branches: [main]
    paths: [day-trader/src/**, day-trader/public/**, day-trader/wrangler.jsonc, day-trader/controle.sh, .github/workflows/day-trader.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: day-trader
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer et controler
        run: |
          set +e
          cd day-trader
          U=https://day-trader.pitch67.workers.dev
          # garde-fou : ne jamais écraser un autre Worker qui porterait déjà le nom « day-trader »
          code=$(curl -sS -m 20 -o /tmp/avant.html -w "%{http_code}" $U/)
          if [ "$code" = "200" ] && ! grep -q "day-trader-app" /tmp/avant.html; then
            echo "STOP : un autre Worker nommé day-trader existe déjà, rien n'a été déployé" > controle.txt
          else
            npx -y wrangler@4 deploy > /tmp/d.log 2>&1; echo "code sortie: $?" >> /tmp/d.log
            sleep 15
            {
              tail -12 /tmp/d.log
              echo "=== page"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" $U/
              echo "=== sonde"; curl -sS -m 60 "$U/api/sonde"; echo
              if [ -f controle.sh ]; then echo "=== controles"; bash controle.sh "$U"; fi
            } > controle.txt 2>&1
          fi
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add day-trader/controle.txt; git commit -m "Controle day-trader [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
