name: Journaux bot95 (lecture seule)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set +e
          cd bot95
          timeout 150 npx -y wrangler@4 tail --format json > /tmp/t.json 2>/tmp/t.err
          python3 - <<'P' > tail.txt
          import json
          out=[];buf=""
          for l in open("/tmp/t.json"):
              buf+=l
              try: o=json.loads(buf); buf=""
              except: continue
              ev=o.get("event") or {}; req=(ev.get("request") or {}).get("url","")
              ex=o.get("exceptions") or []; logs=o.get("logs") or []
              hd=(ev.get("request") or {}).get("headers") or {}; out.append(json.dumps({"t":o.get("eventTimestamp"),"outcome":o.get("outcome"),"url":req[:90],"meth":(ev.get("request") or {}).get("method"),"len":hd.get("content-length"),"ev":list(ev.keys())[:3],"ex":[x.get("message","")[:60] for x in ex[:2]]}))
          print(len(out)); print("\n".join(out[:400]))
          P
          tail -20 /tmp/t.err >> tail.txt
          cd ..; git config user.name tail; git config user.email bot@users.noreply.github.com
          git add bot95/tail.txt && git commit -qm "journaux bot95 [skip ci]" && for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
