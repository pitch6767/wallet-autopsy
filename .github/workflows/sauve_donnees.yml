name: Sauvegarde des donnees brutes
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: [bot95/donnees_go.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python3 etude/bot5min/sauve_donnees.py
          git config user.name sauvegarde; git config user.email bot@users.noreply.github.com
          git add bot95/donnees/; git commit -q -m "Sauvegarde des donnees brutes [skip ci]"; for k in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q && break; sleep 7; done
