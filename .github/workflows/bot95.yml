# déploiement relancé le 06.10.2026 (dépôt public)
name: Deploy bot95
on:
  push:
    branches: [main]
    paths: [bot95/src/**, bot95/wrangler.jsonc, bot95/package.json, .github/workflows/bot95.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POLY_CLE_PRIVEE: ${{ secrets.POLY_CLE_PRIVEE }}
      POLY_ADRESSE_PORTEFEUILLE: ${{ secrets.POLY_ADRESSE_PORTEFEUILLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer et controler
        run: |
          set +e
          cd bot95
          npm install --no-audit --no-fund > /tmp/npm.log 2>&1; tail -3 /tmp/npm.log
          npx -y wrangler@4 deploy > /tmp/d.log 2>&1; echo "code sortie: $?" >> /tmp/d.log
          # clés du portefeuille (secrets GitHub -> secrets Cloudflare), jamais écrites dans le dépôt
          if [ -n "$POLY_CLE_PRIVEE" ]; then echo "$POLY_CLE_PRIVEE" | npx -y wrangler@4 secret put POLY_CLE_PRIVEE >> /tmp/d.log 2>&1; echo "cle: $?" >> /tmp/d.log; fi
          if [ -n "$POLY_ADRESSE_PORTEFEUILLE" ]; then echo "$POLY_ADRESSE_PORTEFEUILLE" | npx -y wrangler@4 secret put POLY_ADRESSE_PORTEFEUILLE >> /tmp/d.log 2>&1; echo "adresse: $?" >> /tmp/d.log; fi
          U=https://bot95.pitch67.workers.dev
          sleep 20; curl -sS -m 20 -o /dev/null -w "page %{http_code}\n" $U/ >> /tmp/c.log
          for k in 1 2 3; do sleep 40; echo "=== etat $k" >> /tmp/c.log; curl -sS -m 20 $U/api/etat | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps({'actifs':d['actifs'],'diag':d['diag'],'vetos':d['e']['vetos'],'candidats':d['e']['candidats'],'trades':len(d['e']['trades'])},ensure_ascii=False))" >> /tmp/c.log 2>&1; echo >> /tmp/c.log; done
          echo "=== v1" >> /tmp/c.log; curl -sS -m 20 "$U/api/etat" | python3 -c "import json,sys;d=json.load(sys.stdin)['v1'];print(json.dumps({'entrees':d.get('entrees'),'pos':d.get('pos'),'refusElan':d.get('refusElan'),'derniers':[(t.get('heure'),t.get('issue'),t.get('net')) for t in d['trades'][:4]],'eth':{'entrees':d['eth'].get('entrees'),'pos':d['eth'].get('pos'),'derniers':[(t.get('heure'),t.get('issue'),t.get('net')) for t in d['eth']['trades'][:4]]},'polyOk':d.get('polyOk'),'latPolyMed':d.get('latPolyMed')},ensure_ascii=False)[:1500])" >> /tmp/c.log 2>&1
          echo "=== fantomes" >> /tmp/c.log; curl -sS -m 20 "$U/api/nouveaux" | head -c 1500 >> /tmp/c.log 2>&1; echo >> /tmp/c.log; curl -sS -m 20 -o /dev/null -w "page nouveaux %{http_code}\n" "$U/nouveaux" >> /tmp/c.log
          echo "=== boite noire" >> /tmp/c.log; curl -sS -m 20 "$U/api/boite/compte" >> /tmp/c.log 2>&1; echo >> /tmp/c.log
          echo "=== sonde binance (idee 2)" >> /tmp/c.log; curl -sS -m 60 "$U/api/binance?s=30" >> /tmp/c.log 2>&1; echo >> /tmp/c.log
          { tail -25 /tmp/d.log; cat /tmp/c.log; } > controle.txt
          cd ..; git config user.name controle; git config user.email bot@users.noreply.github.com
          git add bot95/controle.txt; git commit -m "Controle bot95 [skip ci]"; for k in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
