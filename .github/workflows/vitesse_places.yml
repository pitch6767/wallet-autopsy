name: Vitesse places
on:
  push:
    branches: [main]
    paths: [etude/bot5min/vitesse_places.py]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Autopsie
        run: |
          set +e
          python3 -u etude/bot5min/vitesse_places.py 40 > etude/bot5min/journal_vitesse.txt 2>&1
          echo "code sortie: $?" >> etude/bot5min/journal_vitesse.txt
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/bot5min/
          git commit -m "Resultats vitesse places [skip ci]"; for k in $(seq 1 25); do git pull --rebase -q origin main && git push && break; sleep 7; done
