name: Autopsie portefeuilles
on:
  push:
    branches: [main]
    paths: [etude/bot5min/portefeuilles.py, .github/workflows/portefeuilles.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Autopsie
        run: |
          set +e
          python3 -u etude/bot5min/portefeuilles.py 60 > etude/bot5min/journal_portefeuilles.txt 2>&1
          echo "code sortie: $?" >> etude/bot5min/journal_portefeuilles.txt
          git config user.name tests; git config user.email bot@users.noreply.github.com
          git add etude/bot5min/
          git commit -m "Resultats portefeuilles [skip ci]"; for k in $(seq 1 25); do git pull --rebase -q origin main && git push && break; sleep 7; done
