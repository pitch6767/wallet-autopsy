<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b2a5b">
<title>Mon billet EuroMillions</title>
<!-- euromillions-app -->
<style>
:root{--bleu:#0b2a5b;--bleu2:#16418a;--or:#f2b705;--fond:#f3f5f9;--carte:#fff;--texte:#14213d;--doux:#5b6b85;--vert:#0f8a4b;--rouge:#c0392b;--bord:#dfe5ee}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);-webkit-text-size-adjust:100%}
header{background:linear-gradient(160deg,var(--bleu),var(--bleu2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 22px;text-align:center}
header h1{margin:0;font-size:22px;letter-spacing:.3px}
header p{margin:6px 0 0;opacity:.8;font-size:14px}
main{max-width:560px;margin:0 auto;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:18px;font-size:18px;font-weight:700;cursor:pointer}
.btn-or{background:var(--or);color:#1b1b1b;box-shadow:0 4px 14px rgba(242,183,5,.35)}
.btn-bleu{background:var(--bleu);color:#fff}
.btn-lien{background:none;color:var(--bleu2);font-size:15px;padding:10px;font-weight:600}
.carte{background:var(--carte);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(20,33,61,.08)}
.carte h2{font-size:16px;margin:0 0 12px;color:var(--bleu)}
#apercu{display:none;width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#e6eaf1;margin-top:14px}
.attente{display:none;text-align:center;padding:18px;color:var(--doux)}
.rond{width:34px;height:34px;border:4px solid #cfd8e6;border-top-color:var(--bleu2);border-radius:50%;margin:0 auto 10px;animation:t 1s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.ligne{display:flex;align-items:center;gap:5px;margin-bottom:10px}
.ligne .lettre{width:18px;color:var(--doux);font-weight:700;font-size:14px}
.ligne input{width:100%;min-width:0;text-align:center;font-size:17px;padding:9px 0;border:1.5px solid var(--bord);border-radius:9px;background:#fff;color:var(--texte)}
.ligne input.etoile{border-color:#f0d27a;background:#fffaf0}
.ligne .sep{color:var(--or);font-size:18px}
.suppr{border:0;background:none;color:var(--doux);font-size:20px;padding:0 4px;cursor:pointer}
.champ{width:100%;font-size:17px;padding:10px;border:1.5px solid var(--bord);border-radius:9px}
.dates .ligne input{text-align:left;padding:9px 10px}
.erreur{color:var(--rouge);font-weight:600;margin-top:12px;display:none}
#verdict{display:none;border-radius:18px;padding:22px 16px;text-align:center;margin-top:16px;color:#fff}
#verdict .gros{font-size:34px;font-weight:800;margin:6px 0}
#verdict.gagne{background:linear-gradient(160deg,#0f8a4b,#14a85c)}
#verdict.perdu{background:linear-gradient(160deg,#4a5873,#68779a)}
#verdict.attend{background:linear-gradient(160deg,#16418a,#2a5fb8)}
.boules{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#e9edf4;color:var(--texte)}
.b.n{background:var(--bleu2);color:#fff}
.b.e{background:var(--or);color:#1b1b1b;border-radius:8px}
.b.ok{outline:3px solid var(--vert);outline-offset:1px}
.res-ligne{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bord)}
.res-ligne .gain{font-weight:800;white-space:nowrap}
.res-ligne .gain.oui{color:var(--vert)}
.res-ligne .gain.non{color:var(--doux);font-weight:600}
.petit{font-size:13px;color:var(--doux)}
.mini{display:flex;gap:3px;flex-wrap:wrap}
.mini .b{width:26px;height:26px;font-size:12px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:3px;font-weight:700}
.code b{color:var(--vert)}
</style>
</head>
<body>
<header>
  <h1>Mon billet EuroMillions</h1>
  <p>Photo du billet → je vérifie le tirage → j'annonce le gain</p>
</header>
<main>
  <label class="btn btn-or" for="photo">📷 Photographier le billet</label>
  <input id="photo" type="file" accept="image/*" capture="environment" hidden>
  <img id="apercu" alt="">
  <div class="attente" id="attente"><div class="rond"></div><span id="attenteTexte">Lecture du billet…</span></div>
  <div class="erreur" id="erreur"></div>

  <div id="verdict"></div>
  <div id="detail"></div>

  <div class="carte" id="saisie" style="display:none">
    <h2>Ce que j'ai lu — corrige si besoin</h2>
    <div class="petit" style="margin-bottom:8px">Dates de tirage</div>
    <div class="dates" id="dates"></div>
    <button class="btn btn-lien" id="ajDate">+ ajouter une date</button>
    <div class="petit" style="margin:10px 0 8px">Grilles (5 numéros ★ 2 étoiles)</div>
    <div id="grilles"></div>
    <button class="btn btn-lien" id="ajGrille">+ ajouter une grille</button>
    <div class="petit" style="margin:10px 0 8px">Codes Super-Star</div>
    <div id="ss"></div>
    <button class="btn btn-lien" id="ajSS">+ ajouter un code Super-Star</button>
    <button class="btn btn-bleu" id="verifier" style="margin-top:12px">Vérifier mes gains</button>
  </div>

  <button class="btn btn-lien" id="manuel" style="margin-top:10px">Saisir le billet à la main</button>
</main>
<script>
const $ = s => document.querySelector(s);
const LETTRES = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const chf = v => v.toLocaleString('fr-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' CHF';
const dateFr = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-CH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

function montrer(el, oui) { el.style.display = oui ? 'block' : 'none'; }
function erreur(t) { const e = $('#erreur'); e.textContent = t || ''; montrer(e, !!t); }

function ligneDate(v) {
  const d = document.createElement('div'); d.className = 'ligne';
  d.innerHTML = `<input type="date" value="${v || ''}"><button class="suppr" title="Retirer">×</button>`;
  d.querySelector('.suppr').onclick = () => d.remove();
  $('#dates').appendChild(d);
}
function ligneGrille(g) {
  g = g || { numeros: [], etoiles: [] };
  const d = document.createElement('div'); d.className = 'ligne';
  const n = i => `<input inputmode="numeric" maxlength="2" value="${g.numeros[i] ?? ''}">`;
  const e = i => `<input class="etoile" inputmode="numeric" maxlength="2" value="${g.etoiles[i] ?? ''}">`;
  d.innerHTML = `<span class="lettre"></span>${n(0)}${n(1)}${n(2)}${n(3)}${n(4)}<span class="sep">★</span>${e(0)}${e(1)}<button class="suppr" title="Retirer">×</button>`;
  d.querySelector('.suppr').onclick = () => { d.remove(); lettres(); };
  $('#grilles').appendChild(d); lettres();
}
function lettres() { [...$('#grilles').children].forEach((d, i) => d.querySelector('.lettre').textContent = LETTRES[i] || ''); }
function ligneSS(c) {
  const d = document.createElement('div'); d.className = 'ligne';
  d.innerHTML = `<input class="champ" maxlength="9" autocapitalize="characters" style="text-align:left;letter-spacing:3px" value="${c || ''}" placeholder="ex. N538P"><button class="suppr" title="Retirer">×</button>`;
  d.querySelector('.suppr').onclick = () => d.remove();
  $('#ss').appendChild(d);
}

function remplir(o) {
  $('#dates').innerHTML = ''; $('#grilles').innerHTML = ''; $('#ss').innerHTML = '';
  let dates = o.dates || [];
  if ((!dates.length || o.nombre_tirages > dates.length) && o.premier_tirage) dates = tiragesDepuis(o.premier_tirage, o.nombre_tirages || 1);
  (dates.length ? dates : ['']).forEach(ligneDate);
  (o.grilles?.length ? o.grilles : [null]).forEach(ligneGrille);
  (o.super_star || []).forEach(ligneSS);
  montrer($('#saisie'), true);
}
function tiragesDepuis(premier, nombre) {
  const out = [], d = new Date(premier + 'T12:00:00Z'); let g = 0;
  while (out.length < nombre && g++ < 400) { const j = d.getUTCDay(); if (j === 2 || j === 5) out.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); }
  return out;
}
function lireSaisie() {
  const dates = [...$('#dates').querySelectorAll('input')].map(i => i.value).filter(Boolean);
  const grilles = [...$('#grilles').children].map(d => {
    const v = [...d.querySelectorAll('input')].map(i => parseInt(i.value, 10));
    return { numeros: v.slice(0, 5), etoiles: v.slice(5, 7) };
  });
  const super_star = [...$('#ss').querySelectorAll('input')].map(i => i.value.toUpperCase().replace(/[^A-Z0-9]/g, '')).filter(Boolean);
  return { dates, grilles, super_star };
}
function controler(s) {
  if (!s.dates.length) return 'Indique au moins une date de tirage.';
  for (const [i, g] of s.grilles.entries()) {
    const l = LETTRES[i];
    if (g.numeros.some(n => !(n >= 1 && n <= 50))) return `Grille ${l} : les 5 numéros doivent être entre 1 et 50.`;
    if (new Set(g.numeros).size !== 5) return `Grille ${l} : un numéro est en double.`;
    if (g.etoiles.some(n => !(n >= 1 && n <= 12))) return `Grille ${l} : les 2 étoiles doivent être entre 1 et 12.`;
    if (g.etoiles[0] === g.etoiles[1]) return `Grille ${l} : les 2 étoiles sont identiques.`;
  }
  for (const c of s.super_star) if (!/^[A-Z]\d{3}[A-Z]$/.test(c)) return `Code Super-Star « ${c} » : il faut une lettre, trois chiffres, une lettre.`;
  if (!s.grilles.length && !s.super_star.length) return 'Ajoute au moins une grille.';
  return null;
}

async function reduire(fichier) {
  const url = URL.createObjectURL(fichier);
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
  const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', 0.85);
}

$('#photo').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  erreur(); montrer($('#verdict'), false); $('#detail').innerHTML = ''; montrer($('#saisie'), false);
  const image = await reduire(f);
  $('#apercu').src = image; montrer($('#apercu'), true);
  $('#attenteTexte').textContent = 'Lecture du billet…'; montrer($('#attente'), true);
  try {
    const r = await fetch('/api/lire', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ image }) });
    const o = await r.json();
    montrer($('#attente'), false);
    if (o.erreur) { erreur('Je n\'ai pas réussi à lire le billet. Reprends la photo bien à plat, ou saisis-le à la main.'); remplir({}); return; }
    remplir(o);
    const s = lireSaisie();
    if (!controler(s)) verifier(s);
    else erreur('Vérifie ce que j\'ai lu ci-dessous, puis touche « Vérifier mes gains ».');
  } catch (x) {
    montrer($('#attente'), false); erreur('Connexion impossible. Réessaie.');
  }
  e.target.value = '';
};

$('#ajDate').onclick = () => ligneDate('');
$('#ajGrille').onclick = () => ligneGrille();
$('#ajSS').onclick = () => ligneSS('');
$('#manuel').onclick = () => { erreur(); remplir({}); $('#saisie').scrollIntoView({ behavior: 'smooth' }); };
$('#verifier').onclick = () => {
  const s = lireSaisie(); const pb = controler(s);
  if (pb) return erreur(pb);
  erreur(); verifier(s);
};

async function verifier(s) {
  montrer($('#verdict'), false); $('#detail').innerHTML = '';
  $('#attenteTexte').textContent = 'Je regarde le tirage…'; montrer($('#attente'), true);
  try {
    const r = await fetch('/api/verifier', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(s) });
    const o = await r.json();
    montrer($('#attente'), false);
    if (o.erreur) return erreur(o.erreur);
    afficher(o);
  } catch (x) { montrer($('#attente'), false); erreur('Connexion impossible. Réessaie.'); }
}

function boules(nums, cls, gagnants) {
  return nums.map(n => `<span class="b ${cls}${gagnants && gagnants.includes(n) ? ' ok' : ''}">${n}</span>`).join('');
}
function codeSS(code, tire) {
  return [...code].map((c, i) => c === tire[i] ? `<b>${c}</b>` : c).join('');
}

function afficher(o) {
  const v = $('#verdict');
  const faits = o.tirages.filter(t => t.etat === 'ok');
  const avenir = o.tirages.filter(t => t.etat === 'a_venir');
  if (o.total > 0) { v.className = 'gagne'; v.innerHTML = `🎉 Tu as gagné<div class="gros">${chf(o.total)}</div>${avenir.length ? `<div>${avenir.length} tirage(s) encore à venir</div>` : ''}`; }
  else if (!faits.length) { v.className = 'attend'; v.innerHTML = `<div class="gros" style="font-size:24px">Tirage pas encore publié</div>${o.tirages.map(t => dateFr(t.date)).join('<br>')}`; }
  else { v.className = 'perdu'; v.innerHTML = `<div class="gros" style="font-size:26px">Pas de gain</div>${avenir.length ? `${avenir.length} tirage(s) encore à venir` : 'cette fois-ci'}`; }
  montrer(v, true);

  $('#detail').innerHTML = o.tirages.map(t => {
    if (t.etat !== 'ok') return `<div class="carte"><h2>${dateFr(t.date)}</h2><div class="petit">${t.etat === 'a_venir' ? 'Tirage à venir ou pas encore publié.' : 'Résultats introuvables pour cette date (pas de tirage ce jour-là ?).'}</div></div>`;
    const lignes = t.lignes.map((l, i) => {
      const g = l.gain + l.swissWinGain;
      const quoi = [l.gain ? `${l.bons}+${l.bonnesEtoiles} : ${chf(l.gain)}` : `${l.bons} n° + ${l.bonnesEtoiles} ★`, l.swissWinGain ? `Swiss Win ${l.swissWinBons} n° : ${chf(l.swissWinGain)}` : ''].filter(Boolean).join(' · ');
      return `<div class="res-ligne"><div><div class="mini"><span class="lettre petit" style="width:16px;font-weight:700">${LETTRES[i]}</span>${boules(l.numeros, 'n', t.numeros)}${boules(l.etoiles, 'e', t.etoiles)}</div><div class="petit" style="margin-top:4px">${quoi}</div></div><div class="gain ${g ? 'oui' : 'non'}">${g ? chf(g) : '—'}</div></div>`;
    }).join('');
    const ss = t.superStarLignes.map(x => `<div class="res-ligne"><div><div class="code">${codeSS(x.code, t.superStar || '')}</div><div class="petit">Super-Star${x.rang ? ' · rang ' + x.rang : ''}</div></div><div class="gain ${x.gain ? 'oui' : 'non'}">${x.gain ? chf(x.gain) : '—'}</div></div>`).join('');
    return `<div class="carte"><h2>${dateFr(t.date)}</h2>
      <div class="petit">Tirage</div><div class="boules">${boules(t.numeros, 'n')}${boules(t.etoiles, 'e')}</div>
      ${t.swissWin ? `<div class="petit">Swiss Win</div><div class="boules">${boules(t.swissWin, '')}</div>` : ''}
      ${t.superStar ? `<div class="petit">Super-Star : <span class="code" style="font-size:15px">${t.superStar}</span></div>` : ''}
      <div style="margin-top:8px">${lignes}${ss}</div>
      <div class="res-ligne"><strong>Total du tirage</strong><div class="gain ${t.total ? 'oui' : 'non'}">${chf(t.total)}</div></div></div>`;
  }).join('');
  v.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
